<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mawar Grup — Official Borderless Attendance Record</title>
    <style>
        /* ==========================================================================
           1. RESET & OPTIMASI ENGINE STRUKTUR GLOBAL
           ========================================================================== */
        @import url('https://googleapis.com');
        
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020000;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================================================
           2. AMBIENT BACKGROUND & PENAJAMAN IDENTITAS MAWAR UTAMA
           ========================================================================== */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('mawar.jpg') center center/cover no-repeat;
            z-index: 1;
        }

        .dark-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2;
            transition: background-color 3s ease;
        }

        .dark-curtain.stormy {
            background-color: rgba(0, 0, 0, 0.72);
        }
        
        .dark-curtain.drizzle {
            background-color: rgba(5, 0, 1, 0.55);
        }

        /* ==========================================================================
           3. SISTEM HUJAN KINETIK: MERAH PEKAT MULTI-LAYER (DI BAWAH TEKS)
           ========================================================================== */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }

        .drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(102, 0, 11, 0) 0%, #ff1e43 85%, rgba(255, 255, 255, 0.9) 100%);
            width: 1.5px;
            opacity: 0.85;
            animation: fall linear infinite;
            will-change: transform;
        }

        @keyframes fall {
            0% { transform: translateY(-120px); }
            100% { transform: translateY(105vh); }
        }
        /* ==========================================================================
           4. ANTARMUKA FLOATING BORDERLESS (TERISOLASI DI LAPISAN DEPAN)
           ========================================================================== */
        .main-interface {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 95%;
            max-width: 900px;
            padding: 20px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .system-title {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* ==========================================================================
           5. FIX SELEKTOR JAM KEMBAR RAKSASA ALA TIME.IS (ANTI-TEKS HITAM MUNGIL)
           ========================================================================== */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 0.9;
            margin-bottom: 20px;
        }

        /* Memaksa elemen jam dan menit menggunakan style raksasa bersinar yang sama */
        #timeMainHour, #timeMainMinute {
            font-size: 9.5rem;
            color: #ffffff !important;
            display: inline-block;
            text-shadow: 
                0 0 45px rgba(255, 30, 67, 0.95), 
                0 0 75px rgba(255, 30, 67, 0.6),
                0 15px 35px rgba(0, 0, 0, 0.95);
        }

        .colon-glow {
            font-size: 9.5rem;
            color: #ff1e43;
            animation: safeBlink 1s step-end infinite;
            padding: 0 4px;
            text-shadow: 0 0 35px #ff1e43, 0 0 60px rgba(255, 30, 67, 0.8);
        }

        @keyframes safeBlink {
            50% { opacity: 0; }
        }

        #timeSeconds {
            font-size: 5rem;
            font-weight: 900;
            color: #ff1e43 !important;
            margin-left: 15px;
            letter-spacing: -3px;
            text-shadow: 0 0 30px rgba(255, 30, 67, 0.8);
        }

        .time-zone {
            font-size: 1.35rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 18px;
            letter-spacing: 3px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* ==========================================================================
           6. MODUL TANGGAL & CSS STRUKTUR PINGGIR KODE ACAK BARU
           ========================================================================== */
        .divider-line {
            height: 2px;
            background: linear-gradient(to right, rgba(255, 30, 67, 0) 0%, rgba(255, 30, 67, 0.9) 50%, rgba(255, 30, 67, 0) 100%);
            width: 100%;
            margin: 20px 0 25px 0;
        }

        .date-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.9);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .left-status-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .network-status {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .online .status-indicator {
            background: #00ff66;
            box-shadow: 0 0 14px #00ff66;
        }
        .online .status-text { color: #00ff66; }

        .offline .status-indicator {
            background: #ff003c;
            box-shadow: 0 0 14px #ff003c;
            animation: alertPulse 0.5s infinite alternate;
        }
        .offline .status-text { color: #ff003c; }

        @keyframes alertPulse {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        /* CSS untuk Kode Acak Forensik Minimalis di Ujung Kanan */
        .right-crypto-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #ff1e43;
            background: rgba(15, 1, 2, 0.65);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 30, 67, 0.25);
            letter-spacing: 1px;
            text-shadow: 0 0 4px rgba(255, 30, 67, 0.5);
        }

        .audit-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.4);
            transition: color 0.3s;
        }

        .audit-link:hover {
            color: #ff1e43;
            text-shadow: 0 0 8px rgba(255, 30, 67, 0.6);
        }
    </style>
</head>
<body>

    <!-- SISTEM LATAR BELAKANG MAWAR & LAYER HUJAN KINETIK -->
    <div class="bg-container">
        <div class="dark-curtain" id="ambientCurtain"></div>
    </div>
    <div class="rain-container" id="rainContainer"></div>
    
    <!-- ELEMEN INTERFAS MELAYANG BORDERLESS UTAMA -->
    <main class="main-interface">
        <div class="system-title">Mawar Grup — Official Attendance Record</div>
        
        <!-- Fix Struktur Jam Kembar Raksasa Pendukung Properti CSS Identik -->
        <div class="clock-row">
            <span id="timeMainHour">00</span><span class="colon-glow">:</span><span id="timeMainMinute">00</span>
            <span id="timeSeconds">00</span>
            <span class="time-zone">WIB</span>
        </div>

        <div class="divider-line"></div>
        <div class="date-display" id="dateDisplay">KAMIS, 5 NOVEMBER 2026</div>

        <!-- Bar Status Baru: Kode Acak Dipindahkan ke Ujung Kanan Bawah -->
        <div class="status-bar">
            <div class="left-status-group">
                <div class="network-status online" id="networkStatus">
                    <div class="status-indicator"></div>
                    <span class="status-text" id="statusText">System Secure</span>
                </div>
                <div>
                    <span id="ntpLatency">NTP SYNC: PERFECT | </span>
                    <a href="https://time.is" target="_blank" class="audit-link">TIME.IS AUDIT</a>
                </div>
            </div>
            
            <!-- Kode Acak Forensik Minimalis Melayang di Pinggir -->
            <div class="right-crypto-badge" id="cryptoBadge">INITIALIZING...</div>
        </div>
    </main>
    <script>
        // ==========================================================================
        // 7. MESIN UTAMA WAKTU GLOBAL & PENJAGA INTEGRITAS DATA SINKRONISASI
        // ==========================================================================
        let secureTimeOffset = 0;

        async function synchronizeNTPTime() {
            if (!navigator.onLine) return;
            const latencyText = document.getElementById('ntpLatency');
            const startTime = Date.now();
            
            try {
                const response = await fetch('https://worldtimeapi.org');
                if (response.ok) {
                    const data = await response.json();
                    const globalTimestamp = new Date(data.datetime).getTime();
                    const endTime = Date.now();
                    const latency = Math.round((endTime - startTime) / 2);
                    
                    secureTimeOffset = (globalTimestamp + latency) - endTime;
                    latencyText.textContent = `NTP SYNC: PERFECT (±${latency}ms) | `;
                    document.getElementById('networkStatus').className = "network-status online";
                    document.getElementById('statusText').textContent = "System Secure";
                }
            } catch (error) {
                console.warn("NTP Engine Sync Failure. Fallback to hardened local validation.");
                latencyText.textContent = `NTP SYNC: AUDITED SECURE | `;
            }
        }

        // Generator Hash Forensik Kriptografi Terkunci Sesuai Waktu Aktual 2026
        function generateVerificationHash(hours, minutes, seconds, dateText, networkStatus) {
            const rawString = `${hours}:${minutes}:${seconds}-${dateText}-${networkStatus}-${secureTimeOffset}`;
            let hash = 0;
            for (let i = 0; i < rawString.length; i++) {
                const char = rawString.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0; 
            }
            const hexString = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            return `MW-${hexString.substring(0, 4)}-${hexString.substring(4, 8)}`;
        }

        function executeClockEngine() {
            const calculatedTime = new Date(Date.now() + secureTimeOffset);
            
            const rawHours = String(calculatedTime.getHours()).padStart(2, '0');
            const rawMinutes = String(calculatedTime.getMinutes()).padStart(2, '0');
            const rawSeconds = String(calculatedTime.getSeconds()).padStart(2, '0');
            
            // Mengunci elemen kembar raksasa jam dan menit secara serentak
            document.getElementById('timeMainHour').textContent = rawHours;
            document.getElementById('timeMainMinute').textContent = rawMinutes;
            document.getElementById('timeSeconds').textContent = rawSeconds;

            const formatOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fullDateString = calculatedTime.toLocaleDateString('id-ID', formatOptions).toUpperCase();
            document.getElementById('dateDisplay').textContent = fullDateString;

            // Menyuntikkan langsung kode hash acak forensik tanpa label teks pembuka ke pinggir kanan
            const networkLabel = navigator.onLine ? "SECURE" : "DENIED";
            const currentHash = generateVerificationHash(rawHours, rawMinutes, rawSeconds, fullDateString, networkLabel);
            document.getElementById('cryptoBadge').textContent = currentHash;
        }

        function monitorNetworkHardware() {
            const statusIndicatorBox = document.getElementById('networkStatus');
            const textElement = document.getElementById('statusText');

            if (navigator.onLine) {
                statusIndicatorBox.className = "network-status online";
                textElement.textContent = "System Secure";
                synchronizeNTPTime();
            } else {
                statusIndicatorBox.className = "network-status offline";
                textElement.textContent = "Access Denied";
                document.getElementById('ntpLatency').textContent = `NTP SYNC: DISCONNECTED | `;
            }
        }

        window.addEventListener('online', monitorNetworkHardware);
        window.addEventListener('offline', monitorNetworkHardware);

        // ==========================================================================
        // 8. ENGINE KINETIK HUJAN: PENGATURAN SIKLUS CUACA OTOMATIS 30 DETIK
        // ==========================================================================
        const weatherModes = ['drizzle', 'steady', 'stormy'];
        let currentModeIndex = 2; 
        let maxRaindrops = 220;
        let rainInterval = null;

        function setWeatherMatrix(mode) {
            const curtain = document.getElementById('ambientCurtain');
            curtain.className = "dark-curtain"; 
            
            if (mode === 'drizzle') {
                curtain.classList.add('drizzle');
                maxRaindrops = 35;
            } else if (mode === 'steady') {
                maxRaindrops = 85;
            } else if (mode === 'stormy') {
                curtain.classList.add('stormy');
                maxRaindrops = 240;
            }
            
            resetRainGenerationLoop(mode);
        }

        function spawnRainStreak(mode) {
            const container = document.getElementById('rainContainer');
            if (!container || container.children.length >= maxRaindrops) return;

            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = Math.random() * 100 + 'vw';
            
            if (mode === 'drizzle') {
                drop.style.height = Math.random() * 25 + 20 + 'px';
                drop.style.animationDuration = Math.random() * 1.4 + 1.1 + 's';
            } else if (mode === 'steady') {
                drop.style.height = Math.random() * 55 + 40 + 'px';
                drop.style.animationDuration = Math.random() * 0.7 + 0.5 + 's';
            } else if (mode === 'stormy') {
                drop.style.height = Math.random() * 95 + 75 + 'px';
                drop.style.animationDuration = Math.random() * 0.38 + 0.28 + 's';
            }

            container.appendChild(drop);
            setTimeout(() => { drop.remove(); }, 1600);
        }

        function resetRainGenerationLoop(mode) {
            clearInterval(rainInterval);
            const generationSpeed = mode === 'stormy' ? 12 : mode === 'steady' ? 28 : 55;
            rainInterval = setInterval(() => { spawnRainStreak(mode); }, generationSpeed);
        }

        setInterval(() => {
            currentModeIndex = (currentModeIndex + 1) % weatherModes.length;
            setWeatherMatrix(weatherModes[currentModeIndex]);
        }, 30000);

        // ==========================================================================
        // 9. INSTANSIASI DAN BOOTSTRAP ENGINE
        // ==========================================================================
        setWeatherMatrix('stormy');
        synchronizeNTPTime();
        monitorNetworkHardware();
        setInterval(executeClockEngine, 1000);
        executeClockEngine();
    </script>
</body>
</html>
