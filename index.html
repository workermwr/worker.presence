<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <!-- Font Premium: Cinzel untuk Logo & Inter untuk Jam Solid Rapat ala Time.is -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        /* Kursor Custom Setangkai Mawar Merah */
        html, body, * { cursor: url('mawar-cursor.png'), auto !important; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #020000; color: #e5e5e5;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.88), rgba(2, 0, 0, 0.98)), url('mawar.jpg') no-repeat center center;
            background-size: cover; z-index: 1;
        }

        /* ==================== INTRO GERBANG CYBER MEKANIS ==================== */
        #intro-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .gate-half {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: radial-gradient(circle at center, #0d0204 0%, #030000 100%);
            border: 1px solid #1a0205; box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 998;
        }
        .gate-left { left: 0; border-right: 2px solid #3d050c; }
        .gate-right { right: 0; border-left: 2px solid #3d050c; }

        #intro-container.gate-open .gate-left { transform: translateX(-100%); }
        #intro-container.gate-open .gate-right { transform: translateX(100%); }

        .intro-video-bg {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover; transform: translate(-50%, -50%);
            mix-blend-mode: screen; opacity: 0.55; z-index: 996; pointer-events: none;
        }

        .megah-scan-box {
            position: absolute; width: 500px; height: 350px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 1s ease-in-out;
        }
        #intro-container.gate-open .megah-scan-box { opacity: 0; pointer-events: none; }

        /* Logo MWTT Emas Premium Berpendar Crimson */
        .logo-mwtt-gold {
            font-family: 'Cinzel', serif; font-size: 110px; font-weight: 900; letter-spacing: 4px; line-height: 1;
            background: linear-gradient(135deg, #fff3d1 0%, #ffd700 25%, #d4af37 50%, #aa7c11 75%, #f3e5ab 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            position: relative; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.95));
            animation: logo-glow-pulse 3.5s ease-in-out infinite alternate;
        }

        @keyframes logo-glow-pulse {
            0% { filter: drop-shadow(0 0 10px rgba(255, 0, 51, 0.3)) drop-shadow(2px 4px 6px rgba(0,0,0,0.95)); }
            100% { filter: drop-shadow(0 0 35px rgba(255, 0, 51, 0.85)) drop-shadow(2px 4px 6px rgba(0,0,0,0.95)); }
        }

        .laser-line-megah {
            position: absolute; left: -10%; width: 120%; height: 3px;
            background: linear-gradient(90deg, transparent, #ff0033 20%, #ffffff 50%, #ff0033 80%, transparent);
            box-shadow: 0 0 25px #ff0033, 0 0 50px #ff0033, 0 0 100px #ff0033;
            animation: laser-scan-intense 1.75s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite alternate;
        }

        @keyframes laser-scan-intense {
            0% { top: 15%; opacity: 0.4; transform: scaleX(0.9); }
            50% { opacity: 1; transform: scaleX(1.05); }
            100% { top: 75%; opacity: 0.4; transform: scaleX(0.9); }
        }

        .intro-subtitle {
            font-family: 'Cinzel', serif; font-size: 11px; text-transform: uppercase;
            letter-spacing: 14px; color: #777; margin-top: 25px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9); text-indent: 14px;
        }

        .flash-bang {
            position: absolute; width: 100%; height: 100%; background: #ff0033;
            opacity: 0; z-index: 1000; pointer-events: none; animation: flash 0.7s ease-out forwards;
        }
        @keyframes flash { 0% { opacity: 0.6; } 100% { opacity: 0; } }

        /* ==================== ANTARMUKA JAM DIGITAL ==================== */
        .main-interface {
            position: relative; z-index: 2; width: 100%; max-width: 1200px; padding: 40px; text-align: center;
            opacity: 0; transform: scale(0.96) translateY(10px);
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .main-interface.visible { opacity: 1; transform: scale(1) translateY(0); }

        .corporate-header { font-size: 13px; text-transform: uppercase; letter-spacing: 7px; color: #888888; margin-bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .network-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(15, 0, 0, 0.6); border: 1px solid #2a0005; border-radius: 3px; font-size: 10px; letter-spacing: 2px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; }
        .online .status-dot { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .online { color: #8a9990; }
        .offline .status-dot { background-color: #ff0033; animation: fast-blink 0.4s infinite alternate; }
        .offline { color: #ff3344; border-color: #660011; box-shadow: 0 0 15px rgba(255, 0, 51, 0.1); }
        @keyframes fast-blink { 0% { opacity: 0.2; box-shadow: 0 0px #ff0033; } 100% { opacity: 1; box-shadow: 0 0 10px #ff0033; } }

        /* Layout Jam Solid, Tebal, Rapat Terinspirasi Kerapatan Font Time.is */
        .clock-row { display: flex; justify-content: center; align-items: baseline; font-variant-numeric: tabular-nums; margin-bottom: 20px; }
        .time-main { font-size: 145px; font-weight: 900; color: #eaeeef; letter-spacing: -4px; text-shadow: 0 0 30px rgba(255, 0, 51, 0.45), 0 0 2px rgba(255, 255, 255, 0.95); }
        .colon { animation: slow-blink 1s infinite steps(1, start); padding: 0 2px; color: #eaeeef; letter-spacing: -2px; }
        @keyframes slow-blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
        .time-seconds { font-size: 70px; font-weight: 300; color: #cc1e3d; margin-left: 10px; letter-spacing: -2px; text-shadow: 0 0 15px rgba(204, 30, 61, 0.4); }
        .time-zone { font-size: 26px; font-weight: 800; color: #444444; margin-left: 15px; letter-spacing: 1px; }

        .divider-line { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #800016 15%, #ff0033 50%, #800016 85%, transparent); box-shadow: 0 0 12px rgba(255, 0, 51, 0.6); margin-bottom: 30px; }
        .date-display { font-size: 36px; font-weight: 900; letter-spacing: 6px; color: #d4d4d4; text-transform: uppercase; text-shadow: 0 2px 5px rgba(0,0,0,0.6); margin-bottom: 30px; }

        /* Panel Metadata Source */
        .source-metadata-box { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 10px; letter-spacing: 2px; color: #555555; text-transform: uppercase; }
        .meta-link { text-decoration: none; color: #88182c; font-weight: 600; border-bottom: 1px dotted #440a14; padding-bottom: 2px; transition: all 0.3s ease; }
        .meta-link:hover { color: #ff0033; border-bottom: 1px solid #ff0033; text-shadow: 0 0 8px rgba(255, 0, 51, 0.6); }
    </style>
</head>
<body>
    <div class="background-overlay"></div>

    <!-- Modul Intro Sinematik Gerbang Cyber Mekanis -->
    <div id="intro-container">
        <div class="flash-bang"></div>
        
        <!-- Bilah Gerbang Fisik Kiri & Kanan -->
        <div class="gate-half gate-left"></div>
        <div class="gate-half gate-right"></div>
        
        <!-- Video Kelopak Mawar Sinematik Tersemat di Area Gerbang -->
        <video class="intro-video-bg" autoplay muted loop playsinline>
            <source src="https://pixabay.com" type="video/mp4">
        </video>
        
        <!-- Panel Konten Scan Tengah -->
        <div class="megah-scan-box">
            <div class="laser-line-megah"></div>
            <div class="logo-mwtt-gold">MWTT</div>
            <div class="intro-subtitle">Mawar Grup Secure System</div>
        </div>
    </div>

    <!-- Antarmuka Utama Jam Digital -->
    <div class="main-interface" id="main-ui">
        <div class="corporate-header">
            <span>Mawar Grup — Official Attendance Record</span>
            <div id="net-indicator" class="network-indicator online">
                <div class="status-dot"></div>
                <span id="net-text">SYSTEM SECURE</span>
            </div>
        </div>

        <!-- Baris Jam Horizontal Tunggal (Font Solid Rapat) -->
        <div class="clock-row">
            <span class="time-main" id="clock-main">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="clock-seconds">00</span>
            <span class="time-zone" id="clock-zone">WIB</span>
        </div>

        <div class="divider-line"></div>

        <!-- Tanggal Besar & Tebal -->
        <div class="date-display" id="date-display">KAMIS, 01 JANUARI 1970</div>

        <!-- Panel Informasi Source Terbuka (Link Menuju Time.is) -->
        <div class="source-metadata-box">
            <div class="meta-item">
                TIME REF: <a href="https://time.is" target="_blank" rel="noopener noreferrer" class="meta-link" id="meta-server">GLOBAL NTP SERVER</a>
            </div>
            <div class="meta-item" style="color: #555555;">SECURE LOG: <strong id="meta-status" style="font-weight: 600; color: #8a9990;">SYNCED WITH HTTPS NETWORK</strong></div>
        </div>
    </div>

    <script>
        // Logika Eksekusi Gerbang Mekanis (Tepat 3.5 Detik)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-container');
                const mainUi = document.getElementById('main-ui');
                
                // Trigger kelas CSS untuk menggerakkan gerbang ke kiri & kanan
                intro.classList.add('gate-open');
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    mainUi.classList.add('visible');
                }, 1500); // Sinkronisasi durasi animasi gerbang terbuka
            }, 3500); // Durasi pemindaian laser logo
        });

        // Detektor Status Jaringan Real-Time & Integrasi Link
        function updateNetworkStatus() {
            const indicator = document.getElementById('net-indicator');
            const text = document.getElementById('net-text');
            const metaStatus = document.getElementById('meta-status');
            const metaServer = document.getElementById('meta-server');

            if (navigator.onLine) {
                indicator.className = "network-indicator online";
                text.textContent = "SYSTEM SECURE";
                metaServer.textContent = "GLOBAL NTP SERVER";
                metaServer.setAttribute("href", "https://time.is");
                metaServer.style.pointerEvents = "auto";
                metaStatus.textContent = "SYNCED WITH HTTPS NETWORK";
                metaStatus.style.color = "#8a9990";
            } else {
                indicator.className = "network-indicator offline";
                text.textContent = "ACCESS DENIED";
                metaServer.textContent = "LOCAL INTERNAL CLOCK";
                metaServer.removeAttribute("href");
                metaServer.style.pointerEvents = "none";
                metaStatus.textContent = "NETWORK INTERRUPTED (UNVERIFIED)";
                metaStatus.style.color = "#ff3344";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // Sistem Pembaruan Waktu Jam & Tanggal Teroptimasi
        function updateClock() {
            const now = new Date();

            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock-main').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            const tzString = now.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            document.getElementById('clock-zone').textContent = tzString;

            let dayName = days[now.getDay()];
            let dayNum = String(now.getDate()).padStart(2, '0');
            let monthName = months[now.getMonth()];
            let year = now.getFullYear();

            document.getElementById('date-display').textContent = `${dayName}, ${dayNum} ${monthName} ${year}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
