<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <style>
        /* --- RESET & DASAR --- */
        @import url('https://googleapis.com');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- SISTEM LATAR BELAKANG --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('mawar.jpg') center center/cover no-repeat;
            z-index: 1;
        }

        /* Lapisan Dark Curtain dengan Keredupan Maksimal */
        .dark-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 2;
            animation: breatheGlow 8s ease-in-out infinite alternate;
        }

        @keyframes breatheGlow {
            0% { background: rgba(0, 0, 0, 0.92); }
            100% { background: rgba(15, 0, 0, 0.82); }
        }

        /* Badai Kelopak Mawar Buatan CSS */
        .rose-petal-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff1e43, #800010);
            border-radius: 50% 0 50% 50%;
            opacity: 0.8;
            filter: drop-shadow(0 0 5px rgba(255, 30, 67, 0.6));
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) translateX(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(105vh) translateX(200px) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        /* --- INTRO MEGAH: GERBANG CYBER --- */
        .cyber-gate-left, .cyber-gate-right {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #0d0003 0%, #1a0006 100%);
            border: 2px solid #55000a;
            z-index: 100;
            display: flex;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .cyber-gate-left {
            left: 0;
            justify-content: flex-end;
            border-right: 4px double #ff1e43;
            box-shadow: 10px 0 30px rgba(255, 30, 67, 0.2);
        }

        .cyber-gate-right {
            right: 0;
            justify-content: flex-start;
            border-left: 4px double #ff1e43;
            box-shadow: -10px 0 30px rgba(255, 30, 67, 0.2);
        }

        /* Logo Emas MWTT & Laser Scan */
        .logo-scanner-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 101;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .logo-mwtt {
            font-size: 5rem;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(45deg, #ffe066 0%, #f5b041 50%, #ffe066 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(245, 176, 65, 0.6));
            letter-spacing: 10px;
        }

        .laser-line {
            width: 100%;
            height: 4px;
            background: #ff1e43;
            box-shadow: 0 0 20px #ff1e43, 0 0 40px #ff1e43;
            position: absolute;
            top: 0;
            animation: laserScan 3.5s ease-in-out infinite;
        }

        @keyframes laserScan {
            0%, 100% { top: 0%; opacity: 0; }
            10%, 90% { opacity: 1; }
            50% { top: 100%; }
        }

        /* Trigger Runtuh Mekanis */
        .gate-open .cyber-gate-left { transform: translateX(-100%); }
        .gate-open .cyber-gate-right { transform: translateX(100%); }
        .gate-open .logo-scanner-box { opacity: 0; }

        /* --- ANTARMUKA UTAMA: SASIS BAJA TEBAL GANDA --- */
        .main-interface {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(10, 2, 4, 0.95) 0%, rgba(5, 0, 1, 0.98) 100%);
            border: 8px double #2a2a2a;
            outline: 2px solid #555555;
            padding: 40px 60px;
            border-radius: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 30, 67, 0.05);
            text-align: center;
            max-width: 900px;
            width: 90%;
        }

        /* Aksen Sudut Merah Menyala Formal */
        .main-interface::before, .main-interface::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #ff1e43;
            box-shadow: 0 0 10px #ff1e43;
        }
        .main-interface::before { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .main-interface::after { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        .system-title {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 25px;
            font-weight: 800;
        }

        /* --- DESAIN JAM ALA TIME.IS --- */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 20px;
        }

        /* Angka Jam & Menit Platinum dengan Pendaran Crimson Tajam */
        .time-main {
            font-size: 7.5rem;
            color: #e5e5e5;
            text-shadow: 0 0 25px rgba(255, 30, 67, 0.75), 0 0 50px rgba(255, 30, 67, 0.4);
        }

        /* Kolon Berkedip */
        .colon {
            color: #ff1e43;
            animation: blink 1s steps(2, start) infinite;
            padding: 0 5px;
            text-shadow: 0 0 20px #ff1e43;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        /* Angka Detik: Rose-Red Tanpa Label Tambahan */
        .time-seconds {
            font-size: 4rem;
            font-weight: 800;
            color: #ff1e43;
            margin-left: 15px;
            letter-spacing: -2px;
            text-shadow: 0 0 15px rgba(255, 30, 67, 0.5);
        }

        .time-zone {
            font-size: 1.2rem;
            font-weight: 800;
            color: #888;
            margin-left: 20px;
            letter-spacing: 2px;
        }

        /* --- MODUL TANGGAL & BENTENG VERIFIKASI --- */
        .divider-line {
            height: 4px;
            background: #ff1e43;
            box-shadow: 0 0 10px #ff1e43;
            width: 100%;
            margin: 15px 0 20px 0;
        }

        .date-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #666;
        }

        .network-status {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* Status Secure (Online) */
        .online .status-indicator {
            background: #00ff66;
            box-shadow: 0 0 10px #00ff66;
        }
        .online .status-text { color: #00ff66; }

        /* Status Access Denied (Offline) */
        .offline .status-indicator {
            background: #ff003c;
            box-shadow: 0 0 10px #ff003c;
            animation: fastBlink 0.5s infinite alternate;
        }
        .offline .status-text { color: #ff003c; }

        @keyframes fastBlink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .audit-link {
            color: #888;
            text-decoration: none;
            border-bottom: 1px dashed #444;
            transition: color 0.3s, border-color 0.3s;
        }

        .audit-link:hover {
            color: #ff1e43;
            border-color: #ff1e43;
        }
    </style>
</head>
<body>

    <!-- SISTEM LATAR BELAKANG -->
    <div class="bg-container">
        <div class="dark-curtain"></div>
    </div>
    <div class="rose-petal-container" id="petalContainer"></div>
    <div id="introOverlay">
        <div class="cyber-gate-left"></div>
        <div class="cyber-gate-right"></div>
        <div class="logo-scanner-box">
            <div class="logo-mwtt">MWTT</div>
            <div class="laser-line"></div>
        </div>
    </div>

    <!-- ANTARMUKA UTAMA -->
    <main class="main-interface">
        <div class="system-title">Mawar Grup — Official Attendance Record</div>
        
        <div class="clock-row">
            <span class="time-main" id="timeMain">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="timeSeconds">00</span>
            <span class="time-zone" id="timeZone">WIB</span>
        </div>

        <div class="divider-line"></div>
        <div class="date-display" id="dateDisplay">SENIN, 01 JANUARI 2026</div>

        <div class="status-bar">
            <div class="network-status online" id="networkStatus">
                <div class="status-indicator"></div>
                <span class="status-text" id="statusText">System Secure</span>
            </div>
            <div>
                <span>SECURE VERIFICATION VIA </span>
                <a href="https://time.is" target="_blank" class="audit-link">TIME.IS AUDIT</a>
            </div>
        </div>
    </main>

    <script>
        // --- SINKRONISASI WAKTU GLOBAL & BENTENG ANTI-KECURANGAN ---
        let timeOffset = 0;

        async function syncWithGlobalTime() {
            if (!navigator.onLine) return;
            
            try {
                // Menggunakan endpoint tepercaya untuk mengambil waktu server Jakarta asli
                const response = await fetch('https://worldtimeapi.org');
                if (response.ok) {
                    const data = await response.json();
                    const serverTime = new Date(data.datetime).getTime();
                    const localTime = Date.now();
                    // Koreksi manipulasi waktu lokal dari inspect element / jam laptop
                    timeOffset = serverTime - localTime;
                }
            } catch (error) {
                console.warn("Gagal terhubung ke NTP Server, menggunakan fallback proteksi lokal.");
            }
        }

        function updateClock() {
            const secureTime = new Date(Date.now() + timeOffset);
            
            let hours = String(secureTime.getHours()).padStart(2, '0');
            let minutes = String(secureTime.getMinutes()).padStart(2, '0');
            let seconds = String(secureTime.getSeconds()).padStart(2, '0');
            
            document.getElementById('timeMain').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('timeSeconds').textContent = seconds;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = secureTime.toLocaleDateString('id-ID', options).toUpperCase();
            document.getElementById('dateDisplay').textContent = formattedDate;
        }

        // --- DETEKSI KONEKSI JARINGAN ---
        function updateNetworkStatus() {
            const statusBox = document.getElementById('networkStatus');
            const statusText = document.getElementById('statusText');

            if (navigator.onLine) {
                statusBox.className = "network-status online";
                statusText.textContent = "System Secure";
                syncWithGlobalTime();
            } else {
                statusBox.className = "network-status offline";
                statusText.textContent = "Access Denied";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // --- GENERATOR KELOPAK MAWAR CSS ---
        function createPetal() {
            const container = document.getElementById('petalContainer');
            if (!container) return;

            const petal = document.createElement('div');
            petal.className = 'petal';
            
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 4 + 4 + 's';
            
            container.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 8000);
        }

        // --- INITIALIZATION INITIAL ENGINE ---
        // Pemicu Gerbang Cyber Terbelah (3.5 Detik setelah scan logo MWTT)
        setTimeout(() => {
            document.body.classList.add('gate-open');
            setTimeout(() => {
                const overlay = document.getElementById('introOverlay');
                if (overlay) overlay.style.display = 'none';
            }, 1200);
        }, 3500);

        setInterval(createPetal, 300);

        syncWithGlobalTime();
        updateNetworkStatus();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
