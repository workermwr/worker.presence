<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mawar Grup — Official Attendance Record</title>
    <style>
        /* ==========================================================================
           1. RESET GLOBAL & PENGATURAN ENGINE RENDER
           ========================================================================== */
        @import url('https://googleapis.com');
        
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030001;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* ==========================================================================
           2. SISTEM MULTI-LAYER LATAR BELAKANG (AI DEEP-GLOW ENGINE)
           ========================================================================== */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('mawar.jpg') center center/cover no-repeat;
            transform: scale(1.02);
            filter: blur(1px);
            z-index: 1;
            will-change: transform;
        }

        /* Lapisan Keredupan Maksimal dengan Denyut Cahaya Ambien Bernapas */
        .dark-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.90);
            z-index: 2;
            animation: breatheAmbientGlow 10s ease-in-out infinite alternate;
            will-change: background-color;
        }

        @keyframes breatheAmbientGlow {
            0% { 
                background-color: rgba(0, 0, 0, 0.93); 
                box-shadow: inset 0 0 100px rgba(0, 0, 0, 1);
            }
            100% { 
                background-color: rgba(18, 2, 4, 0.82); 
                box-shadow: inset 0 0 150px rgba(255, 30, 67, 0.08);
            }
        }

        /* ==========================================================================
           3. BADAI KELOPAK MAWAR PREMIUM (LANCIP DI KEDUA UJUNG)
           ========================================================================== */
        .rose-petal-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }

        /* Rekayasa Geometri Kelopak Mawar Lancip Simetris Ganda */
        .petal {
            position: absolute;
            background: linear-gradient(145deg, #ff1e43 15%, #990012 60%, #4a0007 100%);
            
            /* Pembentukan kelopak lancip di kedua ujung (Atas-Bawah) */
            clip-path: polygon(50% 0%, 90% 35%, 100% 50%, 90% 65%, 50% 100%, 10% 65%, 0% 50%, 10% 35%);
            border-radius: 50% 15% 50% 15% / 15% 50% 15% 50%;
            
            opacity: 0.88;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            filter: drop-shadow(0 0 8px rgba(255, 30, 67, 0.65));
            animation: cinematicFall linear infinite;
            will-change: transform, opacity;
        }

        @keyframes cinematicFall {
            0% {
                transform: translateY(-60px) translateX(0) rotate3d(1, 1, 1, 0deg) scale(0.95);
                opacity: 0;
            }
            12% { 
                opacity: 0.88; 
            }
            85% { 
                opacity: 0.88; 
            }
            100% {
                transform: translateY(106vh) translateX(220px) rotate3d(2, 1, 3, 640deg) scale(0.35);
                opacity: 0;
            }
        }
        /* ==========================================================================
           4. INTRO MEGAH: SISTEM GERBANG CYBER 3D MECHANIC
           ========================================================================== */
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        .cyber-gate-left, .cyber-gate-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #050001 0%, #110003 50%, #1a0006 100%);
            border: 1px solid rgba(255, 30, 67, 0.15);
            display: flex;
            align-items: center;
            transition: transform 1.5s cubic-bezier(0.86, 0, 0.07, 1);
            pointer-events: auto;
            will-change: transform;
        }

        .cyber-gate-left {
            left: 0;
            justify-content: flex-end;
            border-right: 3px double #ff1e43;
            box-shadow: 20px 0 50px rgba(255, 30, 67, 0.15), inset -10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .cyber-gate-right {
            right: 0;
            justify-content: flex-start;
            border-left: 3px double #ff1e43;
            box-shadow: -20px 0 50px rgba(255, 30, 67, 0.15), inset 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        /* Logo Emas MWTT & Komponen Pemindai Laser */
        .logo-scanner-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 102;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s ease;
            width: 400px;
        }

        .logo-mwtt {
            font-size: 5.5rem;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(45deg, #ffe066 0%, #f5b041 30%, #ffffff 50%, #f5b041 70%, #ffe066 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 25px rgba(245, 176, 65, 0.45));
            letter-spacing: 15px;
            animation: shineGold 4s linear infinite;
        }

        @keyframes shineGold {
            to { background-position: 200% center; }
        }

        .laser-line {
            width: 100%;
            height: 4px;
            background: #ff1e43;
            box-shadow: 0 0 25px #ff1e43, 0 0 50px #ff1e43, 0 0 80px rgba(255, 30, 67, 0.8);
            position: absolute;
            left: 0;
            top: 0;
            animation: laserScanVertical 3.5s ease-in-out infinite;
            will-change: top, opacity;
        }

        @keyframes laserScanVertical {
            0%, 100% { top: 0%; opacity: 0; transform: scaleX(0.9); }
            10%, 90% { opacity: 1; transform: scaleX(1); }
            50% { top: 100%; transform: scaleX(1.05); }
        }

        /* Mekanisme Trigger Pembukaan Gerbang */
        .gate-open .cyber-gate-left { transform: translateX(-100%); }
        .gate-open .cyber-gate-right { transform: translateX(100%); }
        .gate-open .logo-scanner-box { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }

        /* ==========================================================================
           5. ANTARMUKA UTAMA: ENGINE LIQUID GLASS (BUBBLE MORPHISM)
           ========================================================================== */
        .main-interface {
            position: relative;
            z-index: 10;
            
            /* Formulasi Efek Refraksi & Kaca Cair Premium */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.4) 100%);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            
            /* Radius Ekstrem Menyerupai Gelembung Cair iOS */
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            
            padding: 55px 75px;
            width: 92%;
            max-width: 880px;
            
            /* Multi-layered Depth Shadow (Ilusi Gelembung 3D Mendalam) */
            box-shadow: 
                0 40px 90px rgba(0, 0, 0, 0.85),
                inset 0 6px 25px rgba(255, 255, 255, 0.18),
                inset 0 -6px 30px rgba(0, 0, 0, 0.5),
                inset 0 0 40px rgba(255, 30, 67, 0.03),
                0 0 40px rgba(255, 30, 67, 0.04);
                
            text-align: center;
            transform: translateZ(0);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Lapisan Kilatan Kaca Lengkung Atas (Glossy Specular Highlight) */
        .main-interface::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 4%;
            width: 92%;
            height: 38%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.01) 80%, rgba(255, 255, 255, 0) 100%);
            border-radius: 55px 55px 100px 100px;
            pointer-events: none;
        }

        /* Pantulan Bayangan Cahaya Dasar Gelembung */
        .main-interface::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 8%;
            width: 84%;
            height: 15%;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 100px / 30px;
            pointer-events: none;
        }

        .system-title {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 35px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }
        /* ==========================================================================
           6. ARSITEKTUR JAM DIGITAL ALA TIME.IS (CRIMSON RENDER)
           ========================================================================== */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 0.95;
            margin-bottom: 25px;
        }

        /* Angka Utama Jam & Menit Platinum dengan Pendaran Crimson Tajam */
        .time-main {
            font-size: 8.5rem;
            color: #ffffff;
            text-shadow: 
                0 0 35px rgba(255, 30, 67, 0.7), 
                0 15px 30px rgba(0, 0, 0, 0.6),
                0 0 70px rgba(255, 30, 67, 0.3);
        }

        /* Kolon Berkedip Presisi */
        .colon {
            color: #ff1e43;
            animation: fluidBlink 1s steps(2, start) infinite;
            padding: 0 4px;
            text-shadow: 0 0 30px #ff1e43, 0 0 50px rgba(255, 30, 67, 0.8);
        }

        @keyframes fluidBlink {
            to { visibility: hidden; }
        }

        /* Angka Detik: Rose-Red Tipis & Agresif */
        .time-seconds {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ff1e43;
            margin-left: 15px;
            letter-spacing: -3px;
            text-shadow: 0 0 25px rgba(255, 30, 67, 0.65);
        }

        .time-zone {
            font-size: 1.25rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.45);
            margin-left: 18px;
            letter-spacing: 3px;
        }

        /* ==========================================================================
           7. MODUL TANGGAL & BENTENG VERIFIKASI AURA
           ========================================================================== */
        .divider-line {
            height: 1px;
            background: linear-gradient(to right, rgba(255, 30, 67, 0) 0%, rgba(255, 30, 67, 0.85) 50%, rgba(255, 30, 67, 0) 100%);
            width: 100%;
            margin: 25px 0 30px 0;
        }

        .date-display {
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.4);
        }

        .network-status {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 12px;
        }

        /* Status Secure (Online) */
        .online .status-indicator {
            background: #00ff66;
            box-shadow: 0 0 14px #00ff66;
        }
        .online .status-text { color: #00ff66; }

        /* Status Terblokir / Offline */
        .offline .status-indicator {
            background: #ff003c;
            box-shadow: 0 0 14px #ff003c;
            animation: alertPulse 0.5s infinite alternate;
        }
        .offline .status-text { color: #ff003c; }

        @keyframes alertPulse {
            0% { opacity: 0.25; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .audit-link {
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.35);
            transition: color 0.3s, border-color 0.3s;
        }

        .audit-link:hover {
            color: #ff1e43;
            border-color: #ff1e43;
            text-shadow: 0 0 8px rgba(255, 30, 67, 0.5);
        }
    </style>
</head>
<body>

    <!-- LAYER LATAR BELAKANG ELEMEN -->
    <div class="bg-container">
        <div class="dark-curtain"></div>
    </div>
    <div class="rose-petal-container" id="petalContainer"></div>
    
    <!-- MODUL INTRO GERBANG CYBER -->
    <div id="introOverlay">
        <div class="cyber-gate-left"></div>
        <div class="cyber-gate-right"></div>
        <div class="logo-scanner-box">
            <div class="logo-mwtt">MWTT</div>
            <div class="laser-line"></div>
        </div>
    </div>

    <!-- SASIS GELEMBUNG UTAMA -->
    <main class="main-interface">
        <div class="system-title">Mawar Grup — Official Attendance Record</div>
        
        <div class="clock-row">
            <span class="time-main" id="timeMain">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="timeSeconds">00</span>
            <span class="time-zone" id="timeZone">WIB</span>
        </div>

        <div class="divider-line"></div>
        <div class="date-display" id="dateDisplay">SENIN, 01 JANUARI 2026</div>

        <div class="status-bar">
            <div class="network-status online" id="networkStatus">
                <div class="status-indicator"></div>
                <span class="status-text" id="statusText">System Secure</span>
            </div>
            <div>
                <span>SECURE VERIFICATION VIA </span>
                <a href="https://time.is" target="_blank" class="audit-link">TIME.IS AUDIT</a>
            </div>
        </div>
    </main>
    <script>
        // ==========================================================================
        // 8. LOGIKA BENTENG ANTI-KECURANGAN & ANTARMUKA SISTEM
        // ==========================================================================
        let secureTimeOffset = 0;

        async function synchronizeNTPTime() {
            if (!navigator.onLine) return;
            
            try {
                // Fetch timestamp akurat untuk zona waktu Jakarta bebas manipulasi lokal
                const response = await fetch('https://worldtimeapi.org');
                if (response.ok) {
                    const data = await response.json();
                    const globalTimestamp = new Date(data.datetime).getTime();
                    const localTimestamp = Date.now();
                    // Menghitung deviasi waktu lokal browser untuk mengunci keabsahan data
                    secureTimeOffset = globalTimestamp - localTimestamp;
                }
            } catch (error) {
                console.warn("NTP Engine Sync Failure. Fallback to protected local engine.");
            }
        }

        function executeClockEngine() {
            const calculatedTime = new Date(Date.now() + secureTimeOffset);
            
            const rawHours = String(calculatedTime.getHours()).padStart(2, '0');
            const rawMinutes = String(calculatedTime.getMinutes()).padStart(2, '0');
            const rawSeconds = String(calculatedTime.getSeconds()).padStart(2, '0');
            
            document.getElementById('timeMain').innerHTML = `${rawHours}<span class="colon">:</span>${rawMinutes}`;
            document.getElementById('timeSeconds').textContent = rawSeconds;

            const formatOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fullDateString = calculatedTime.toLocaleDateString('id-ID', formatOptions).toUpperCase();
            document.getElementById('dateDisplay').textContent = fullDateString;
        }

        function monitorNetworkHardware() {
            const statusIndicatorBox = document.getElementById('networkStatus');
            const textElement = document.getElementById('statusText');

            if (navigator.onLine) {
                statusIndicatorBox.className = "network-status online";
                textElement.textContent = "System Secure";
                synchronizeNTPTime();
            } else {
                statusIndicatorBox.className = "network-status offline";
                textElement.textContent = "Access Denied";
            }
        }

        window.addEventListener('online', monitorNetworkHardware);
        window.addEventListener('offline', monitorNetworkHardware);

        // ==========================================================================
        // 9. ENGINE GENERATOR DAUN/KELOPAK MAWAR LANCIP GANDA
        // ==========================================================================
        function spawnDynamicPetal() {
            const targetContainer = document.getElementById('petalContainer');
            if (!targetContainer) return;

            const petalElement = document.createElement('div');
            petalElement.className = 'petal';
            
            // Pengaturan skala acak geometris
            const calculatedSize = Math.random() * 18 + 12 + 'px';
            petalElement.style.width = calculatedSize;
            petalElement.style.height = calculatedSize;
            
            // Penempatan sebaran horizontal acak
            petalElement.style.left = Math.random() * 100 + 'vw';
            
            // Variasi durasi translasi jatuh sinematik
            petalElement.style.animationDuration = Math.random() * 5 + 4 + 's';
            
            targetContainer.appendChild(petalElement);

            // Garbage Collection DOM otomatis untuk merawat performa RAM
            setTimeout(() => {
                petalElement.remove();
            }, 9000);
        }

        // ==========================================================================
        // 10. BOOTSTRAP INITIALIZATION ENGINE
        // ==========================================================================
        // Pemicu Gerbang Cyber Terbelah Dua Mekanis (3,5 detik scanning)
        setTimeout(() => {
            document.body.classList.add('gate-open');
            setTimeout(() => {
                const overlayElement = document.getElementById('introOverlay');
                if (overlayElement) overlayElement.style.display = 'none';
            }, 1500);
        }, 3500);

        // Pemicu Simpul Generator Kelopak Mawar Daun Tajam
        setInterval(spawnDynamicPetal, 250);

        // Eksekusi Sinkronisasi Inti & Perulangan Loop 1 Detik
        synchronizeNTPTime();
        monitorNetworkHardware();
        setInterval(executeClockEngine, 1000);
        executeClockEngine();
    </script>
</body>
</html>
