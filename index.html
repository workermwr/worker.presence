<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronograph Haute Horlogerie — True iOS Glass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Vektor Mawar Merah Gelap Sinematik — DIJAMIN 100% PASTI MUNCUL */
        .rose-full-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Panel Kaca iOS Nyata dengan Peningkatan Kontras Komponen */
        .clock-display-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 50vw;
            padding: 6vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Formula Efek Kaca iOS Frosted Premium */
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(35px) saturate(160%);
            -webkit-backdrop-filter: blur(35px) saturate(160%);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
            
            animation: iOSFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Tulisan sambung premium dengan kejelasan tinggi */
        .welcome-cursive {
            font-family: 'Georgia', 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 5.8vh;
            font-weight: 300;
            color: #fff2db; 
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
            text-shadow: 0px 3px 15px rgba(0, 0, 0, 0.6);
        }

        .status-pill {
            font-size: 1.4vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #ff3b30; /* Warna Merah Sistem iOS Murni */
            margin-bottom: 4vh;
            display: block;
            text-shadow: 0 2px 8px rgba(255, 59, 48, 0.3);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            margin-bottom: 4vh;
        }

        /* Desain Jam Putih Neon Lembut Khas Layar Kunci iPhone */
        .time-row {
            font-size: 21vh;
            font-weight: 200; 
            letter-spacing: -1px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.35)) drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        .seconds-row {
            font-size: 4.8vh;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6); 
            letter-spacing: 3px;
            margin-top: 1.5vh;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 1.9vh;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 5px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 2vh;
            width: 85%;
            display: inline-block;
        }

        @keyframes iOSFadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Mawar Kode Internal Kejelasan Tinggi (Anti-Gagal Memuat) -->
    <div class="rose-full-background">
        <svg xmlns="http://w3.org" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
            <rect width="1920" height="1080" fill="#060606"/>
            <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stop-color="#4a0006" stop-opacity="0.6"/>
                <stop offset="60%" stop-color="#140002" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#030303" stop-opacity="0"/>
            </radialGradient>
            <rect width="1920" height="1080" fill="url(#bg-glow)"/>
            <!-- Komposisi Seni Mawar Merah Tengah Layar -->
            <g transform="translate(960, 540) scale(2.2)" opacity="0.65">
                <path d="M0,-80 C120,-180 250,-100 250,30 C250,160 120,240 0,240 C-120,240 -250,160 -250,30 C-250,-100 -120,-180 0,-80 Z" fill="#1c0003"/>
                <path d="M0,-50 C80,-120 170,-70 170,20 C170,110 80,160 0,160 C-80,160 -170,110 -170,20 C-170,-70 -80,-120 0,-50 Z" fill="#3d0107"/>
                <path d="M0,-20 C50,-70 100,-40 100,10 C100,60 50,100 0,100 C-50,100 -100,60 -100,10 C-100,-40 -50,-70 0,-20 Z" fill="#6e020d"/>
                <path d="M0,0 C30,-40 60,-20 60,5 C60,30 30,50 0,50 C-30,50 -60,30 -60,5 C-60,-20 -30,-40 0,0 Z" fill="#a80514"/>
                <path d="M0,10 C15,-15 30,-5 30,10 C30,25 15,35 0,35 C-15,35 -30,25 -30,10 C-30,-5 -15,-15 0,10 Z" fill="#e61228"/>
            </g>
        </svg>
    </div>

    <!-- Tampilan Antarmuka Kaca iOS -->
    <div class="clock-display-wrapper">
        <div class="welcome-cursive">Welcome back, Abdul</div>
        <span class="status-pill">Absolute Precision Broadcast</span>
        
        <div class="time-box">
            <div id="hm-clock" class="time-row">00:00</div>
            <div id="s-clock" class="seconds-row">00 SEC</div>
        </div>
        
        <div id="date">Loading Timepiece...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('hm-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('s-clock').textContent = `${seconds} SEC`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
