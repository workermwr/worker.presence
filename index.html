<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronograph Haute Horlogerie — Luxury Timepiece</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Memindahkan jam ke sisi kanan untuk tata letak modern */
            overflow: hidden;
            position: relative;
        }

        /* Foto Mawar Berada di Sisi Kiri dengan Efek Fade ke Gelap */
        .rose-side-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%;
            height: 100%;
            background-image: linear-gradient(90deg, rgba(3, 3, 3, 0.2) 0%, rgba(3, 3, 3, 0.95) 85%, #030303 100%), 
                              url('https://wikimedia.org');
            background-size: cover;
            background-position: left center;
            z-index: 1;
            pointer-events: none;
        }

        /* Kontainer Utama di Sisi Kiri yang Mewah */
        .clock-display-wrapper {
            position: relative;
            z-index: 2;
            padding-right: 8%; /* Jarak dari pinggir kanan layar */
            text-align: right; /* Rata kanan agar artistik */
            animation: cubicFadeIn 2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Tulisan Sambung Cursive Mewah untuk Menyambut Abdul */
        .welcome-cursive {
            font-family: 'Georgia', 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 3.8rem; /* Font sambung berukuran besar */
            font-weight: 300;
            color: #f7e7c4; /* Warna putih gading champagne */
            margin-bottom: -15px; /* Merapatkan jarak dengan teks bawah */
            letter-spacing: 1px;
            text-transform: none; /* Menjaga bentuk huruf sambung alami */
            opacity: 0.95;
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.8);
        }

        .status-pill {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: #bd1e2c;
            margin-bottom: 40px;
            display: block;
            text-shadow: 0 0 10px rgba(189, 30, 44, 0.3);
        }

        /* Struktur Waktu Bertumpuk yang Berani dan Tidak Standar */
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 0.8;
            margin-bottom: 40px;
        }

        .time-row {
            font-size: 13rem; /* Sangat besar dan dominan */
            font-weight: 100;
            letter-spacing: -6px;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #ffe596 0%, #d4af37 40%, #aa7c11 75%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 15px 30px rgba(0, 0, 0, 0.95));
        }

        .seconds-row {
            font-size: 5rem;
            font-weight: 200;
            color: #8a7333; /* Emas redup untuk pembeda detik */
            letter-spacing: 2px;
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 1.1rem;
            font-weight: 300;
            color: #737373;
            letter-spacing: 6px;
            text-transform: uppercase;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 15px;
            display: inline-block;
        }

        @keyframes cubicFadeIn {
            0% { opacity: 0; transform: translateX(30px); filter: blur(4px); }
            100% { opacity: 1; transform: translateX(0); filter: blur(0); }
        }
    </style>
</head>
<body>

    <!-- Foto Mawar Fokus di Sisi Kiri Layar -->
    <div class="rose-side-background"></div>

    <!-- Tampilan Jam Desain Asimetris -->
    <div class="clock-display-wrapper">
        <!-- Tulisan Sambung Cursive -->
        <div class="welcome-cursive">Welcome back, Abdul</div>
        <span class="status-pill">Absolute Precision Broadcast</span>
        
        <!-- Jam dan Menit di Atas, Detik Mengalir di Bawahnya -->
        <div class="time-box">
            <div id="hm-clock" class="time-row">00:00</div>
            <div id="s-clock" class="seconds-row">00 SEC</div>
        </div>
        
        <div id="date">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            // Format waktu terpisah agar tata letak tidak kaku bersambung datar
            document.getElementById('hm-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('s-clock').textContent = `${seconds} SEC`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
