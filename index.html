<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronograph Haute Horlogerie — iOS Glass Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background mawar hitam-merah estetik */
        .rose-full-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.85) 90%), 
                              url('https://wikimedia.org');
            background-size: cover;
            background-position: center;
            z-index: 1;
            pointer-events: none;
        }

        /* Panel Kaca Mewah ala iOS Lockscreen (Glassmorphism) */
        .clock-display-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 45vw;
            padding: 5vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Efek Kaca Frosted Glass */
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px) saturate(120%);
            -webkit-backdrop-filter: blur(25px) saturate(120%);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            animation: iOSFadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Tulisan sambung premium dengan warna champagne elegan */
        .welcome-cursive {
            font-family: 'Georgia', 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 5.5vh;
            font-weight: 300;
            color: rgba(247, 231, 196, 0.95); 
            margin-bottom: 0.5vh;
            letter-spacing: 1px;
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.4);
        }

        .status-pill {
            font-size: 1.3vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: rgba(235, 30, 51, 0.85); /* Merah iOS tipis */
            margin-bottom: 3.5vh;
            display: block;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            margin-bottom: 3.5vh;
        }

        /* Warna Putih Transparan Ikonis iOS dengan Pendaran Glow Lembut */
        .time-row {
            font-size: 20vh;
            font-weight: 200; /* Tipis minimalis khas Apple */
            letter-spacing: -2px;
            color: rgba(255, 255, 255, 0.92);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 
                        0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .seconds-row {
            font-size: 4.5vh;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5); /* Detik redup transparan */
            letter-spacing: 3px;
            margin-top: 1.5vh;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 1.8vh;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 5px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 2vh;
            width: 80%;
            display: inline-block;
        }

        @keyframes iOSFadeIn {
            0% { opacity: 0; transform: scale(0.95); blur(10px); }
            100% { opacity: 1; transform: scale(1); blur(0); }
        }
    </style>
</head>
<body>

    <div class="rose-full-background"></div>

    <!-- Tampilan Utama dengan Efek Kaca iOS -->
    <div class="clock-display-wrapper">
        <div class="welcome-cursive">Welcome back, Abdul</div>
        <span class="status-pill">Absolute Precision Broadcast</span>
        
        <div class="time-box">
            <div id="hm-clock" class="time-row">00:00</div>
            <div id="s-clock" class="seconds-row">00 SEC</div>
        </div>
        
        <div id="date">Loading Timepiece...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('hm-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('s-clock').textContent = `${seconds} SEC`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
