<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mawar Grup — Official Enterprise Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .rose-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(circle at center, rgba(5, 5, 5, 0.4) 0%, rgba(5, 5, 5, 0.98) 85%), 
                              url('mawar.jpg');
            background-size: cover;
            background-position: center;
        }

        .workspace-panel {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 80vw;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .corporate-header {
            font-size: 2.8vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #e0e0e0;
            margin-bottom: 12px;
        }

        .corporate-sub {
            font-size: 1.6vh;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #bd1e2c; 
            margin-bottom: 6vh;
        }

        .time-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            margin-bottom: 6vh;
        }

        /* PERUBAHAN WARNA: Mengurangi intensitas putih menjadi abu-abu metalik dengan glow crimson misterius */
        #clock-hm {
            font-size: 24vh;
            font-weight: 200;
            letter-spacing: -2px;
            color: #d1d1d1; /* Mengubah putih solid menjadi abu-abu terang premium */
            font-variant-numeric: tabular-nums;
            /* Efek pendaran merah gelap di sekeliling angka agar tetap kontras dan terbaca tajam */
            filter: drop-shadow(0 0 15px rgba(189, 30, 44, 0.45)) drop-shadow(0 15px 30px rgba(0, 0, 0, 0.95));
        }

        #clock-s {
            font-size: 5vh;
            font-weight: 300;
            color: #444444; 
            letter-spacing: 4px;
            margin-top: 2vh;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 3.2vh; 
            font-weight: 500;
            color: #b5b5b5;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-top: 2px solid #bd1e2c; 
            padding-top: 3vh;
            width: 60%;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="rose-background"></div>

    <div class="workspace-panel">
        <div class="corporate-header">Mawar Grup</div>
        <div class="corporate-sub">Official Workspace</div>
        
        <div class="time-container">
            <div id="clock-hm">00:00</div>
            <div id="clock-s">00 SEC</div>
        </div>
        
        <div id="date">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock-hm').textContent = `${hours}:${minutes}`;
            document.getElementById('clock-s').textContent = `${seconds} SEC`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
