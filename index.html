<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronograph Haute Horlogerie — Luxury Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* FOTO MAWAR ASLI BERGAYA DARK PHOTOGRAPHY (DITANAM LANGSUNG KE KODE) */
        .rose-full-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            /* Lapisan gradasi gelap + Foto mawar merah makro asli */
            background-image: radial-gradient(circle at center, rgba(3, 3, 3, 0.3) 0%, rgba(3, 3, 3, 0.9) 85%), 
                              url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAHCA4QDAREAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9U6KKKKACMainjQp0U6gBKKU0UAFJS0UAJRSmigBtLS0UAJRRmigBKWikoAWkop1ACUUpooASilNFACUUZooAKKWigBKBRTqAEoozRQAmaWkpaACkpaKACkpaKAEopTRQAlFLRQA2lpTRQAlLSUtACUUoooASlop1ACUUUUAFJS0UAJSUtFACUtJRQAtFFFACUUU6gBKKKWgBKSnUUANpaKKAEopaKAEpaSkoAWiiigBKKU0UANpaKWgBtLRRQA2lp1FACUUUUAFFFFABRRmigD/9k=');
            background-size: cover;
            background-position: center;
        }

        /* Panel Kaca iOS Nyata dengan Peningkatan Kontras Komponen */
        .clock-display-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 55vw;
            padding: 6vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Formula Efek Kaca Frosted Glass Transparan ala Apple */
            background: rgba(255, 255, 255, 0.06) !important;
            backdrop-filter: blur(35px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(35px) saturate(180%) !important;
            
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.3) !important;
            
            animation: iOSFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .welcome-cursive {
            font-family: 'Georgia', 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 6vh;
            font-weight: 300;
            color: #fff1d6; 
            margin-bottom: 0.8vh;
            letter-spacing: 1px;
            text-shadow: 0px 3px 15px rgba(0, 0, 0, 0.6);
        }

        .status-pill {
            font-size: 1.5vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #ff453a; 
            margin-bottom: 3.5vh;
            display: block;
            text-shadow: 0 2px 8px rgba(255, 69, 58, 0.4);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 3.5vh;
        }

        .liquid-glass-svg {
            width: 100%;
            height: 22vh;
        }

        /* EFEK LIQUID GLASS PADA ANGKA JAM */
        .liquid-text {
            font-size: 21vh;
            font-weight: 200;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-anchor: middle;
            fill: url(#liquid-gradient);
            filter: drop-shadow(0 2px 3px rgba(255, 255, 255, 0.6)) drop-shadow(0 15px 20px rgba(0, 0, 0, 0.7));
        }

        .seconds-row {
            font-size: 5vh;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55); 
            letter-spacing: 3px;
            margin-top: 1vh;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 2vh;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 5px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding-top: 2.5vh;
            width: 85%;
            display: inline-block;
        }

        @keyframes iOSFadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Mawar Asli (Anti-Gagal Memuat) -->
    <div class="rose-full-background"></div>

    <div class="clock-display-wrapper">
        <div class="welcome-cursive">Welcome back, Abdul</div>
        <span class="status-pill">Absolute Precision Broadcast</span>
        
        <div class="time-box">
            <svg class="liquid-glass-svg">
                <defs>
                    <linearGradient id="liquid-gradient" x1="0%" y1="0%" x2="200%" y2="0%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
                        <stop offset="25%" stop-color="rgba(230,230,230,0.5)"/>
                        <stop offset="50%" stop-color="rgba(160,160,160,0.2)"/>
                        <stop offset="55%" stop-color="rgba(255,255,255,0.85)"/>
                        <stop offset="75%" stop-color="rgba(240,240,240,0.6)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0.95)"/>
                        <animate attributeName="x1" from="0%" to="-100%" dur="8s" repeatCount="indefinite" />
                        <animate attributeName="x2" from="200%" to="100%" dur="8s" repeatCount="indefinite" />
                    </linearGradient>
                </defs>
                <text id="hm-clock" x="50%" y="85%" class="liquid-text">00:00</text>
            </svg>
            
            <div id="s-clock" class="seconds-row">00 SEC</div>
        </div>
        
        <div id="date">Loading Timepiece...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('hm-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('s-clock').textContent = `${seconds} SEC`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
