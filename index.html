<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mawar Grup — Official Borderless Attendance Record</title>
    <style>
        /* ==========================================================================
           1. RESET & OPTIMASI ENGINE STRUKTUR GLOBAL
           ========================================================================== */
        @import url('https://googleapis.com');
        
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020000;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================================================
           2. AMBIENT BACKGROUND & TIRAI GELAP MAWAR
           ========================================================================== */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('mawar.jpg') center center/cover no-repeat;
            z-index: 1;
        }

        .dark-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.91);
            z-index: 2;
            transition: background-color 3s ease;
        }

        /* Tingkat keredupan ambien ekstra saat cuaca badai/hujan deras */
        .dark-curtain.stormy {
            background-color: rgba(0, 0, 0, 0.94);
        }
        
        .dark-curtain.drizzle {
            background-color: rgba(8, 0, 2, 0.88);
        }

        /* ==========================================================================
           3. SISTEM CUACA KINETIK: MULTI-LAYER RED RAIN
           ========================================================================== */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }

        /* Desain partikel hujan berbentuk garis meteor tajam semi-transparan */
        .drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255, 30, 67, 0) 0%, rgba(255, 30, 67, 0.75) 70%, #ffffff 100%);
            width: 1.5px;
            opacity: 0.8;
            animation: fall linear infinite;
            will-change: transform;
        }

        @keyframes fall {
            0% {
                transform: translateY(-120px);
            }
            100% {
                transform: translateY(105vh);
            }
        }
        /* ==========================================================================
           4. INTRO MEGAH: SISTEM GERBANG CYBER 3D MECHANIC
           ========================================================================== */
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        .cyber-gate-left, .cyber-gate-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #040001 0%, #0d0003 50%, #150005 100%);
            border: 1px solid rgba(255, 30, 67, 0.12);
            display: flex;
            align-items: center;
            transition: transform 1.6s cubic-bezier(0.86, 0, 0.07, 1);
            pointer-events: auto;
            will-change: transform;
        }

        .cyber-gate-left {
            left: 0;
            justify-content: flex-end;
            border-right: 3px double #ff1e43;
            box-shadow: 25px 0 60px rgba(255, 30, 67, 0.15), inset -15px 0 40px rgba(0, 0, 0, 0.85);
        }

        .cyber-gate-right {
            right: 0;
            justify-content: flex-start;
            border-left: 3px double #ff1e43;
            box-shadow: -25px 0 60px rgba(255, 30, 67, 0.15), inset 15px 0 40px rgba(0, 0, 0, 0.85);
        }

        .logo-scanner-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 102;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s ease;
            width: 420px;
        }

        .logo-mwtt {
            font-size: 5.5rem;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(45deg, #ffe066 0%, #f5b041 30%, #ffffff 50%, #f5b041 70%, #ffe066 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 25px rgba(245, 176, 65, 0.45));
            letter-spacing: 15px;
            animation: shineGold 4s linear infinite;
        }

        @keyframes shineGold {
            to { background-position: 200% center; }
        }

        .laser-line {
            width: 100%;
            height: 4px;
            background: #ff1e43;
            box-shadow: 0 0 25px #ff1e43, 0 0 50px #ff1e43;
            position: absolute;
            left: 0;
            top: 0;
            animation: laserScanVertical 3.5s ease-in-out infinite;
            will-change: top, opacity;
        }

        @keyframes laserScanVertical {
            0%, 100% { top: 0%; opacity: 0; }
            10%, 90% { opacity: 1; }
            50% { top: 100%; }
        }

        .gate-open .cyber-gate-left { transform: translateX(-100%); }
        .gate-open .cyber-gate-right { transform: translateX(100%); }
        .gate-open .logo-scanner-box { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }

        /* ==========================================================================
           5. ANTARMUKA FLOATING BORDERLESS (TANPA KOTAK / SASIS)
           ========================================================================== */
        .main-interface {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 95%;
            max-width: 900px;
            padding: 20px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .system-title {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* ==========================================================================
           6. TIPOGRAFI JAM DIGITAL ALA TIME.IS (TEBAL RAPAT & CRIMSON GLOW)
           ========================================================================== */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 0.9;
            margin-bottom: 20px;
        }

        /* Pendaran merah (Crimson Glow) tebal diekspansi maksimum agar terbaca jelas sekilas */
        .time-main {
            font-size: 9.5rem;
            color: #ffffff;
            text-shadow: 
                0 0 40px rgba(255, 30, 67, 0.9), 
                0 0 70px rgba(255, 30, 67, 0.5),
                0 15px 35px rgba(0, 0, 0, 0.9);
        }

        .colon {
            color: #ff1e43;
            animation: fluidBlink 1s steps(2, start) infinite;
            padding: 0 2px;
            text-shadow: 0 0 35px #ff1e43, 0 0 60px rgba(255, 30, 67, 0.8);
        }

        @keyframes fluidBlink {
            to { visibility: hidden; }
        }

        .time-seconds {
            font-size: 5rem;
            font-weight: 900;
            color: #ff1e43;
            margin-left: 15px;
            letter-spacing: -3px;
            text-shadow: 0 0 30px rgba(255, 30, 67, 0.8);
        }

        .time-zone {
            font-size: 1.35rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 18px;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }
        /* ==========================================================================
           7. MODUL TANGGAL & BENTENG FORENSIK DIGITAL BERLAPIS
           ========================================================================== */
        .divider-line {
            height: 2px;
            background: linear-gradient(to right, rgba(255, 30, 67, 0) 0%, rgba(255, 30, 67, 0.9) 50%, rgba(255, 30, 67, 0) 100%);
            width: 100%;
            margin: 20px 0 25px 0;
        }

        .date-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.9);
        }

        /* Enkripsi Kode Token Pengaman Tepat Di Bawah Tanggal (Mudah Terfoto Sekilas) */
        .crypto-verification-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #ff1e43;
            background: rgba(20, 2, 4, 0.65);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 30, 67, 0.3);
            letter-spacing: 2px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 5px rgba(255, 30, 67, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .network-status {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 12px;
        }

        /* Status Sinkronisasi Online Sempurna */
        .online .status-indicator {
            background: #00ff66;
            box-shadow: 0 0 14px #00ff66;
        }
        .online .status-text { color: #00ff66; }

        /* Akses Terblokir / Jam Lokal Dimanipulasi */
        .offline .status-indicator {
            background: #ff003c;
            box-shadow: 0 0 14px #ff003c;
            animation: alertPulse 0.5s infinite alternate;
        }
        .offline .status-text { color: #ff003c; }

        @keyframes alertPulse {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .audit-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            transition: color 0.3s;
        }

        .audit-link:hover {
            color: #ff1e43;
            text-shadow: 0 0 8px rgba(255, 30, 67, 0.6);
        }
    </style>
</head>
<body>

    <!-- SISTEM LATAR BELAKANG & LAYER HUJAN KINETIK -->
    <div class="bg-container">
        <div class="dark-curtain" id="ambientCurtain"></div>
    </div>
    <div class="rain-container" id="rainContainer"></div>
    
    <!-- OVERLAY GERBANG CYBER UTAMA -->
    <div id="introOverlay">
        <div class="cyber-gate-left"></div>
        <div class="cyber-gate-right"></div>
        <div class="logo-scanner-box">
            <div class="logo-mwtt">MWTT</div>
            <div class="laser-line"></div>
        </div>
    </div>

    <!-- ELEMEN INTERFAS MELAYANG BORDERLESS -->
    <main class="main-interface">
        <div class="system-title">Mawar Grup — Official Attendance Record</div>
        
        <div class="clock-row">
            <span class="time-main" id="timeMain">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="timeSeconds">00</span>
            <span class="time-zone" id="timeZone">WIB</span>
        </div>

        <div class="divider-line"></div>
        <div class="date-display" id="dateDisplay">KAMIS, 5 NOVEMBER 2026</div>
        
        <!-- Barcode Forensik Token Unik Untuk Bukti Validasi Foto Sekilas -->
        <div class="crypto-verification-badge" id="cryptoBadge">SECURE TOKEN: INITIALIZING...</div>

        <div class="status-bar">
            <div class="network-status online" id="networkStatus">
                <div class="status-indicator"></div>
                <span class="status-text" id="statusText">System Secure</span>
            </div>
            <div>
                <span id="ntpLatency">NTP SYNC: PENDING | </span>
                <a href="https://time.is" target="_blank" class="audit-link">TIME.IS AUDIT</a>
            </div>
        </div>
    </main>
    <script>
        // ==========================================================================
        // 8. BENTENG SINKRONISASI NTP & PROTEKSI KECURANGAN MANIPULASI JAM
        // ==========================================================================
        let secureTimeOffset = 0;
        let lastGeneratedHash = "";

        async function synchronizeNTPTime() {
            if (!navigator.onLine) return;
            const latencyText = document.getElementById('ntpLatency');
            const startTime = Date.now();
            
            try {
                // Mengambil waktu server terenkripsi Asia/Jakarta bebas manipulasi internal laptop
                const response = await fetch('https://worldtimeapi.org');
                if (response.ok) {
                    const data = await response.json();
                    const globalTimestamp = new Date(data.datetime).getTime();
                    const endTime = Date.now();
                    const latency = Math.round((endTime - startTime) / 2);
                    
                    // Mengunci kalkulasi offset delta deviasi jam browser
                    secureTimeOffset = (globalTimestamp + latency) - endTime;
                    latencyText.textContent = `NTP SYNC: PERFECT (±${latency}ms) | `;
                }
            } catch (error) {
                console.warn("NTP Server Failure. Protected local backup engine active.");
                latencyText.textContent = `NTP SYNC: LOCAL PROTECTED | `;
            }
        }

        // ==========================================================================
        // 9. GENERATOR HASH KRIPTOGRAFI FORENSIK (BUKTI SECURE FOTO SEKILAS)
        // ==========================================================================
        function generateVerificationHash(hours, minutes, seconds, dateText, networkStatus) {
            // Simulasi algoritma hashing SHA-256 ringkas berbasis string gabungan parameter waktu forensik
            const rawString = `${hours}:${minutes}:${seconds}-${dateText}-${networkStatus}-${secureTimeOffset}`;
            let hash = 0;
            for (let i = 0; i < rawString.length; i++) {
                const char = rawString.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0; 
            }
            // Konversi ke format string token heksadesimal unik khas korporat Mawar Grup
            const hexString = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            return `MW-${hexString.substring(0, 4)}-${hexString.substring(4, 8)}`;
        }

        function executeClockEngine() {
            const calculatedTime = new Date(Date.now() + secureTimeOffset);
            
            const rawHours = String(calculatedTime.getHours()).padStart(2, '0');
            const rawMinutes = String(calculatedTime.getMinutes()).padStart(2, '0');
            const rawSeconds = String(calculatedTime.getSeconds()).padStart(2, '0');
            
            document.getElementById('timeMain').innerHTML = `${rawHours}<span class="colon">:</span>${rawMinutes}`;
            document.getElementById('timeSeconds').textContent = rawSeconds;

            const formatOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fullDateString = calculatedTime.toLocaleDateString('id-ID', formatOptions).toUpperCase();
            document.getElementById('dateDisplay').textContent = fullDateString;

            // Perbarui kode verifikasi kriptografi unik setiap detik secara konstan
            const networkLabel = navigator.onLine ? "SECURE" : "DENIED";
            const cryptoBadge = document.getElementById('cryptoBadge');
            lastGeneratedHash = generateVerificationHash(rawHours, rawMinutes, rawSeconds, fullDateString, networkLabel);
            cryptoBadge.textContent = `TOKEN VERIFIKASI: ${lastGeneratedHash}`;
        }

        function monitorNetworkHardware() {
            const statusIndicatorBox = document.getElementById('networkStatus');
            const textElement = document.getElementById('statusText');

            if (navigator.onLine) {
                statusIndicatorBox.className = "network-status online";
                textElement.textContent = "System Secure";
                synchronizeNTPTime();
            } else {
                statusIndicatorBox.className = "network-status offline";
                textElement.textContent = "Access Denied";
                document.getElementById('ntpLatency').textContent = `NTP SYNC: DISCONNECTED | `;
            }
        }

        window.addEventListener('online', monitorNetworkHardware);
        window.addEventListener('offline', monitorNetworkHardware);

        // ==========================================================================
        // 10. ENGINE KINETIK CUACA: DINAMIS BERUBAH SETIAP 30 DETIK
        // ==========================================================================
        const weatherModes = ['drizzle', 'steady', 'stormy'];
        let currentModeIndex = 2; // Mulai dari badai hujan deras pasca intro terbuka
        let maxRaindrops = 150;
        let rainInterval = null;

        function setWeatherMatrix(mode) {
            const curtain = document.getElementById('ambientCurtain');
            curtain.className = "dark-curtain"; 
            
            if (mode === 'drizzle') {
                curtain.classList.add('drizzle');
                maxRaindrops = 30; // Gerimis: Sedikit partikel air
            } else if (mode === 'steady') {
                maxRaindrops = 75;  // Hujan Sedang: Kerapatan medium
            } else if (mode === 'stormy') {
                curtain.classList.add('stormy');
                maxRaindrops = 220; // Badai Hujan Deras: Sangat padat dan gelap
            }
            
            resetRainGenerationLoop(mode);
        }

        function spawnRainStreak(mode) {
            const container = document.getElementById('rainContainer');
            if (!container || container.children.length >= maxRaindrops) return;

            const drop = document.createElement('div');
            drop.className = 'drop';
            
            // Pengaturan parameter acak berbasis arah jatuhnya hujan meteor lurus
            drop.style.left = Math.random() * 100 + 'vw';
            
            // Penyesuaian visual panjang & kecepatan partikel air berdasarkan status cuaca
            if (mode === 'drizzle') {
                drop.style.height = Math.random() * 30 + 20 + 'px';
                drop.style.animationDuration = Math.random() * 1.5 + 1.2 + 's'; // Jatuh melambat
            } else if (mode === 'steady') {
                drop.style.height = Math.random() * 60 + 40 + 'px';
                drop.style.animationDuration = Math.random() * 0.8 + 0.6 + 's';
            } else if (mode === 'stormy') {
                drop.style.height = Math.random() * 100 + 70 + 'px'; // Garis panjang (Motion Blur)
                drop.style.animationDuration = Math.random() * 0.4 + 0.3 + 's'; // Super cepat terhempas
            }

            container.appendChild(drop);
            setTimeout(() => { drop.remove(); }, 1800);
        }

        function resetRainGenerationLoop(mode) {
            clearInterval(rainInterval);
            // Engine secara berkala menyemburkan tetesan hujan ke dalam DOM
            const speed = mode === 'stormy' ? 15 : mode === 'steady' ? 30 : 60;
            rainInterval = setInterval(() => { spawnRainStreak(mode); }, speed);
        }

        // Jalankan transisi siklus interpolasi cuaca secara periodik setiap 30 detik
        setInterval(() => {
            currentModeIndex = (currentModeIndex + 1) % weatherModes.length;
            setWeatherMatrix(weatherModes[currentModeIndex]);
        }, 30000);

        // ==========================================================================
        // 11. BOOTSTRAP INITIALIZATION ENGINE
        // ==========================================================================
        // Pemicu Gerbang Cyber Terbelah Dua Mekanis (3,5 detik scanning)
        setTimeout(() => {
            document.body.classList.add('gate-open');
            setTimeout(() => {
                const overlayElement = document.getElementById('introOverlay');
                if (overlayElement) overlayElement.style.display = 'none';
            }, 1600);
        }, 3500);

        // Inisialisasi awal sistem jam, cuaca badai, dan pendeteksi hardware
        setWeatherMatrix('stormy');
        synchronizeNTPTime();
        monitorNetworkHardware();
        setInterval(executeClockEngine, 1000);
        executeClockEngine();
    </script>
</body>
</html>
