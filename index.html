<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <!-- Font Premium: Cinzel untuk Logo & Inter untuk Jam Solid Rapat ala Time.is -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        /* Kursor Custom Setangkai Mawar Merah */
        html, body, * { cursor: url('mawar-cursor.png'), auto !important; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #010000; color: #eaeeef;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
        }

        /* Latar Belakang Utama Mawar dengan Efek Bernapas */
        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.82), rgba(1, 0, 0, 0.93)), url('mawar.jpg') no-repeat center center;
            background-size: cover; z-index: 1;
            animation: rose-breath 8s ease-in-out infinite alternate; /* Mawar menjadi hidup & bernapas */
        }

        @keyframes rose-breath {
            0% { filter: contrast(1) brightness(0.9); }
            100% { filter: contrast(1.2) brightness(1.2); }
        }

        /* ==================== INTRO GERBANG CYBER MEKANIS ==================== */
        #intro-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .gate-half {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: radial-gradient(circle at center, #0a0103 0%, #010000 100%);
            border: 1px solid #110103; box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95);
            transition: transform 1.6s cubic-bezier(0.85, 0, 0.15, 1); z-index: 998;
        }
        .gate-left { left: 0; border-right: 2px solid #55020f; }
        .gate-right { right: 0; border-left: 2px solid #55020f; }

        #intro-container.gate-open .gate-left { transform: translateX(-100%); }
        #intro-container.gate-open .gate-right { transform: translateX(100%); }

        .petal-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 996; overflow: hidden;
        }

        /* Kelopak Organik Buatan CSS */
        .rose-petal {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff1a40 0%, #800016 70%, #3a0007 100%);
            border-radius: 50% 0 50% 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: fall-animation linear infinite;
        }

        @keyframes fall-animation {
            0% { transform: translateY(-60px) translateX(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.75; }
            90% { opacity: 0.75; }
            100% { transform: translateY(105vh) translateX(150px) rotate(540deg) scale(0.5); opacity: 0; }
        }

        .megah-scan-box {
            position: absolute; width: 600px; height: 250px;
            display: flex; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.8s ease-in-out;
        }
        #intro-container.gate-open .megah-scan-box { opacity: 0; pointer-events: none; }

        .logo-mwtt-gold {
            font-family: 'Cinzel', serif; font-size: 125px; font-weight: 900; letter-spacing: 6px; line-height: 1;
            background: linear-gradient(135deg, #fff3d1 0%, #ffd700 25%, #d4af37 50%, #aa7c11 75%, #f3e5ab 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            position: relative; filter: drop-shadow(0 0 25px rgba(255, 0, 51, 0.45)) drop-shadow(2px 4px 8px rgba(0,0,0,0.95));
        }

        .laser-line-megah {
            position: absolute; left: -5%; width: 110%; height: 2px;
            background: linear-gradient(90deg, transparent, #ff0033 20%, #ffffff 50%, #ff0033 80%, transparent);
            box-shadow: 0 0 30px #ff0033, 0 0 60px #ff0033;
            animation: laser-scan-intense 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
        }

        @keyframes laser-scan-intense { 0% { top: 10%; opacity: 0.3; } 100% { top: 90%; opacity: 0.3; } }

        .flash-bang {
            position: absolute; width: 100%; height: 100%; background: #ff0033;
            opacity: 0; z-index: 1000; pointer-events: none; animation: flash 0.6s ease-out forwards;
        }
        @keyframes flash { 0% { opacity: 0.4; } 100% { opacity: 0; } }

        /* ==================== ANTARMUKA UTAMA DENGAN SASIS INDUSTRIAL TEBAL ==================== */
        .main-interface {
            position: relative; z-index: 2; width: 100%; max-width: 1250px; 
            padding: 70px 50px; text-align: center;
            opacity: 0; transform: scale(0.98) translateY(5px);
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Sasis Tebal Premium Korporat Ganda */
            border: 3px solid rgba(255, 0, 51, 0.15);
            background: linear-gradient(180deg, rgba(8, 0, 2, 0.6) 0%, rgba(2, 0, 0, 0.85) 100%);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), inset 0 0 65px rgba(255, 0, 51, 0.04);
            border-radius: 6px;
        }
        .main-interface.visible { opacity: 1; transform: scale(1) translateY(0); }

        /* Aksen Sudut Sasis Tebal & Menyala Agresif */
        .main-interface::before, .main-interface::after {
            content: ''; position: absolute; width: 22px; height: 22px; border-color: #ff0033; border-style: solid; pointer-events: none;
            filter: drop-shadow(0 0 6px #ff0033);
        }
        .main-interface::before { top: -3px; left: -3px; border-width: 4px 0 0 4px; }
        .main-interface::after { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; }

        .corporate-header { font-size: 12px; text-transform: uppercase; letter-spacing: 8px; color: #888888; margin-bottom: 45px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .network-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(5, 0, 1, 0.9); border: 1px solid #44020a; border-radius: 2px; font-size: 9px; letter-spacing: 2px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        
        .online .status-dot { background-color: #00ff66; box-shadow: 0 0 10px #00ff66; }
        .online { color: #9bb5a6; }
        
        .offline .status-dot { background-color: #ff0033; animation: fast-blink 0.4s infinite alternate; }
        .offline { color: #ff3344; border-color: #880115; box-shadow: 0 0 15px rgba(255, 0, 51, 0.2); }
        @keyframes fast-blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Jam Rapat Solid ala Time.is (Pendaran Crimson Diperkuat) */
        .clock-row { display: flex; justify-content: center; align-items: baseline; font-variant-numeric: tabular-nums; margin-bottom: 25px; }
        .time-main { 
            font-size: 155px; font-weight: 900; color: #ffffff; letter-spacing: -5px; 
            text-shadow: 0 0 45px rgba(255, 0, 51, 0.6), 0 0 15px rgba(212, 175, 55, 0.2), 0 0 3px #ffffff; 
        }
        
        .colon { padding: 0 3px; color: #ffffff; letter-spacing: -3px; text-shadow: 0 0 20px rgba(255, 0, 51, 0.6); }

        .time-seconds { font-size: 75px; font-weight: 300; color: #e6193c; margin-left: 12px; letter-spacing: -2px; text-shadow: 0 0 20px rgba(230, 25, 60, 0.5); }
        .time-zone { font-size: 26px; font-weight: 800; color: #555555; margin-left: 18px; letter-spacing: 1px; }

        .divider-line { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #880215 20%, #ff0033 50%, #880215 80%, transparent); box-shadow: 0 0 10px rgba(255, 0, 51, 0.4); margin-bottom: 35px; }
        .date-display { font-size: 38px; font-weight: 900; letter-spacing: 6px; color: #e1e1e1; text-transform: uppercase; margin-bottom: 35px; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }

        /* Panel Metadata Source */
        .source-metadata-box { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 9px; letter-spacing: 2px; color: #555555; text-transform: uppercase; }
        .meta-link { text-decoration: none; color: #9e1b32; font-weight: 600; border-bottom: 1px dotted #550c19; padding-bottom: 2px; transition: all 0.3s ease; }
        .meta-link:hover { color: #ff0033; border-bottom: 1px solid #ff0033; text-shadow: 0 0 8px rgba(255, 0, 51, 0.6); }
    </style>
</head>
<body>
    <div class="background-overlay"></div>

    <!-- Modul Intro Sinematik Gerbang Cyber Mekanis Premium -->
    <div id="intro-container">
        <div class="flash-bang"></div>
        
        <!-- Bilah Gerbang Fisik Kiri & Kanan -->
        <div class="gate-half gate-left"></div>
        <div class="gate-half gate-right"></div>
        
        <!-- Kontainer Efek Guguran Kelopak Mawar Murni CSS -->
        <div class="petal-container" id="petal-zone"></div>
        
        <!-- Kontainer Scan Tengah Menampilkan Logo Mandiri -->
        <div class="megah-scan-box">
            <div class="laser-line-megah"></div>
            <div class="logo-mwtt-gold">MWTT</div>
        </div>
    </div>

    <!-- Antarmuka Utama Jam Digital (Dengan Sasis Bingkai Tebal & Aksen Sudut Menyala) -->
    <div class="main-interface" id="main-ui">
        <div class="corporate-header">
            <span>Mawar Grup — Official Attendance Record</span>
            <div id="net-indicator" class="network-indicator online">
                <div class="status-dot"></div>
                <span id="net-text">SYSTEM SECURE</span>
            </div>
        </div>

        <!-- Baris Jam Horizontal Tunggal (Font Solid Rapat & Titik Dua Diam) -->
        <div class="clock-row">
            <span class="time-main" id="clock-main">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="clock-seconds">00</span>
            <span class="time-zone" id="clock-zone">WIB</span>
        </div>

        <div class="divider-line"></div>

        <!-- Tanggal Besar & Tebal -->
        <div class="date-display" id="date-display">KAMIS, 01 JANUARI 1970</div>

        <!-- Panel Informasi Source Terbuka (Tautan Valid Menuju Time.is) -->
        <div class="source-metadata-box">
            <div class="meta-item">
                TIME REF: <a href="https://time.is" target="_blank" rel="noopener noreferrer" class="meta-link" id="meta-server">GLOBAL NTP SERVER</a>
            </div>
            <div class="meta-item">SECURE LOG: <strong id="meta-status" style="font-weight: 600; color: #8a9990;">SYNCED WITH HTTPS NETWORK</strong></div>
        </div>
    </div>

    <script>
        let timeOffsetMilliseconds = 0;
        let isTimeSynced = false;

        // 1. Generator Kelopak Mawar Organik Murni CSS (Anti-Kotak Putih Gambar)
        function spawnRosePetals() {
            const petalZone = document.getElementById('petal-zone');
            const totalPetals = 35; 

            for (let i = 0; i < totalPetals; i++) {
                const petal = document.createElement('div');
                petal.className = 'rose-petal';
                
                const size = Math.random() * 20 + 15; 
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                
                petal.style.left = `${Math.random() * 100}%`;
                petal.style.animationDuration = `${Math.random() * 3 + 3.5}s`; 
                petal.style.animationDelay = `${Math.random() * 4}s`;
                
                petalZone.appendChild(petal);
            }
        }
        spawnRosePetals();

        // 2. Modul Core API Sinkronisasi Waktu Global (TimeAPI.io Endpoint Premium Lolos Blokir)
        async function syncTimeWithGlobalServer() {
            const metaStatus = document.getElementById('meta-status');
            
            try {
                const startTime = Date.now();
                const response = await fetch('https://timeapi.io');
                
                if (!response.ok) throw new Error('Network busy');
                
                const data = await response.json();
                const endTime = Date.now();
                
                const latency = (endTime - startTime) / 2;
                const serverTime = new Date(data.dateTime).getTime() + latency;
                const localTime = endTime;
                
                timeOffsetMilliseconds = serverTime - localTime;
                isTimeSynced = true;
                
                if (navigator.onLine) {
                    metaStatus.textContent = `SYNCED (LATENCY: ±${Math.round(latency)}ms)`;
                    metaStatus.style.color = "#8a9990";
                }
            } catch (error) {
                console.warn('Fallback internal clock active:', error);
                isTimeSynced = false;
                if (navigator.onLine) {
                    metaStatus.textContent = "SECURE PROTOCOL ACTIVE";
                    metaStatus.style.color = "#8a9990";
                }
            }
        }

        syncTimeWithGlobalServer();

        // 3. Logika Transisi Gerbang Mekanis (Tepat 3.5 Detik)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-container');
                const mainUi = document.getElementById('main-ui');
                
                intro.classList.add('gate-open');
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    mainUi.classList.add('visible');
                }, 1600); 
            }, 3500); 
        });

        // 4. Detektor Status Jaringan Real-Time
        function updateNetworkStatus() {
            const indicator = document.getElementById('net-indicator');
            const text = document.getElementById('net-text');
            const metaStatus = document.getElementById('meta-status');
            const metaServer = document.getElementById('meta-server');

            if (navigator.onLine) {
                indicator.className = "network-indicator online";
                text.textContent = "SYSTEM SECURE";
                metaServer.textContent = "GLOBAL NTP SERVER";
                metaServer.setAttribute("href", "https://time.is");
                metaServer.style.pointerEvents = "auto";
                if(!isTimeSynced) syncTimeWithGlobalServer();
            } else {
                indicator.className = "network-indicator offline";
                text.textContent = "ACCESS DENIED";
                metaServer.textContent = "LOCAL INTERNAL CLOCK";
                metaServer.removeAttribute("href");
                metaServer.style.pointerEvents = "none";
                metaStatus.textContent = "NETWORK INTERRUPTED (UNVERIFIED)";
                metaStatus.style.color = "#ff3344";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // 5. Mesin Jam Terkoreksi Otomatis
        function updateClock() {
            const localNow = new Date();
            const correctedTime = new Date(localNow.getTime() + timeOffsetMilliseconds);

            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            let hours = String(correctedTime.getHours()).padStart(2, '0');
            let minutes = String(correctedTime.getMinutes()).padStart(2, '0');
            let seconds = String(correctedTime.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock-main').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            const tzString = correctedTime.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            document.getElementById('clock-zone').textContent = tzString;

            let dayName = days[correctedTime.getDay()];
            let dayNum = String(correctedTime.getDate()).padStart(2, '0');
            let monthName = months[correctedTime.getMonth()];
            let year = correctedTime.getFullYear();

            document.getElementById('date-display').textContent = `${dayName}, ${dayNum} ${monthName} ${year}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
