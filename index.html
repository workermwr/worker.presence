<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronograph Haute Horlogerie — Liquid Glass Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050001 0%, #1a0003 35%, #380208 70%, #0d0002 100%) !important;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(189, 30, 44, 0.35) 0%, rgba(0, 0, 0, 0) 70%) !important;
            top: 20%;
            left: 20%;
            z-index: 1;
            pointer-events: none;
            filter: blur(80px);
        }

        .clock-display-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 55vw;
            padding: 6vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(40px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
            
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.25) !important;
            
            animation: iOSFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .welcome-cursive {
            font-family: 'Georgia', 'Playfair Display', cursive, serif;
            font-style: italic;
            font-size: 6vh;
            font-weight: 300;
            color: #fff1d6; 
            margin-bottom: 0.8vh;
            letter-spacing: 1px;
            text-shadow: 0px 3px 15px rgba(0, 0, 0, 0.6);
        }

        .status-pill {
            font-size: 1.5vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #ff453a; 
            margin-bottom: 3.5vh;
            display: block;
            text-shadow: 0 2px 8px rgba(255, 69, 58, 0.4);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 3.5vh;
        }

        /* STRUKTUR BARU: Memaksa Efek Kaca Cair Menggunakan Metode SVG */
        .liquid-glass-svg {
            width: 100%;
            height: 22vh;
        }

        .liquid-text {
            font-size: 21vh;
            font-weight: 200;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-anchor: middle;
            fill: url(#liquid-gradient);
            filter: drop-shadow(0 2px 3px rgba(255, 255, 255, 0.6)) drop-shadow(0 15px 20px rgba(0, 0, 0, 0.7));
        }

        .seconds-row {
            font-size: 5vh;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55); 
            letter-spacing: 3px;
            margin-top: 1vh;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 2vh;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 5px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding-top: 2.5vh;
            width: 85%;
            display: inline-block;
        }

        @keyframes iOSFadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="clock-display-wrapper">
        <div class="welcome-cursive">Welcome back, Abdul</div>
        <span class="status-pill">Absolute Precision Broadcast</span>
        
        <div class="time-box">
            <!-- SVG Kontainer untuk menjaga kilau kaca cair tetap aktif -->
            <svg class="liquid-glass-svg">
                <defs>
                    <!-- Gradasi reflektif logam kaca cair dengan animasi pergeseran -->
                    <linearGradient id="liquid-gradient" x1="0%" y1="0%" x2="200%" y2="0%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
                        <stop offset="25%" stop-color="rgba(230,230,230,0.5)"/>
                        <stop offset="50%" stop-color="rgba(160,160,160,0.2)"/>
                        <stop offset="55%" stop-color="rgba(255,255,255,0.85)"/>
                        <stop offset="75%" stop-color="rgba(240,240,240,0.6)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0.95)"/>
                        
                        <animate attributeName="x1" from="0%" to="-100%" dur="7s" repeatCount="indefinite" />
                        <animate attributeName="x2" from="200%" to="100%" dur="7s" repeatCount="indefinite" />
                    </linearGradient>
                </defs>
                <text id="hm-clock" x="50%" y="85%" class="liquid-text">00:00</text>
            </svg>
            
            <div id="s-clock" class="seconds-row">00 SEC</div>
        </div>
        
        <div id="date">Loading Timepiece...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('hm-clock').textContent = `${hours}:${minutes}`;
            document.getElementById('s-clock').textContent = `${seconds} SEC`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
