<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <!-- Memuat Font Premium Korporat Mewah & Jam Solid Rapat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Base Style */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        /* Mengunci Kursor Custom Setangkai Mawar Merah */
        html, body, * { cursor: url('mawar-cursor.png'), auto !important; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #010000; color: #eaeeef;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
        }

        /* Latar Belakang Utama Mawar Misterius */
        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(1, 0, 0, 0.98)), url('mawar.jpg') no-repeat center center;
            background-size: cover; z-index: 1;
        }

        /* ==================== INTRO GERBANG CYBER MEKANIS ==================== */
        #intro-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* Pembagian Bilah Gerbang Fisik Kiri & Kanan */
        .gate-half {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: radial-gradient(circle at center, #0a0103 0%, #010000 100%);
            border: 1px solid #110103; box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95);
            transition: transform 1.6s cubic-bezier(0.85, 0, 0.15, 1); z-index: 998;
        }
        .gate-left { left: 0; border-right: 1px solid #4a050e; }
        .gate-right { right: 0; border-left: 1px solid #4a050e; }

        #intro-container.gate-open .gate-left { transform: translateX(-100%); }
        #intro-container.gate-open .gate-right { transform: translateX(100%); }

        /* Kontainer Utama Efek Animasi Guguran Kelopak Mawar PNG */
        .petal-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 996; overflow: hidden;
        }

        .rose-petal {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            animation: fall-animation linear infinite;
        }

        @keyframes fall-animation {
            0% { transform: translateY(-60px) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(105vh) translateX(120px) rotate(360deg); opacity: 0; }
        }

        /* Kontainer Papan Logo Tengah */
        .megah-scan-box {
            position: absolute; width: 600px; height: 250px;
            display: flex; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.8s ease-in-out;
        }
        #intro-container.gate-open .megah-scan-box { opacity: 0; pointer-events: none; }

        /* Logo MWTT Emas Premium */
        .logo-mwtt-gold {
            font-family: 'Cinzel', serif; font-size: 125px; font-weight: 900; letter-spacing: 6px; line-height: 1;
            background: linear-gradient(135deg, #fff3d1 0%, #ffd700 25%, #d4af37 50%, #aa7c11 75%, #f3e5ab 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            position: relative; filter: drop-shadow(0 0 25px rgba(255, 0, 51, 0.45)) drop-shadow(2px 4px 8px rgba(0,0,0,0.95));
        }

        .laser-line-megah {
            position: absolute; left: -5%; width: 110%; height: 2px;
            background: linear-gradient(90deg, transparent, #ff0033 20%, #ffffff 50%, #ff0033 80%, transparent);
            box-shadow: 0 0 30px #ff0033, 0 0 60px #ff0033;
            animation: laser-scan-intense 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
        }

        @keyframes laser-scan-intense {
            0% { top: 10%; opacity: 0.3; }
            100% { top: 90%; opacity: 0.3; }
        }

        .flash-bang {
            position: absolute; width: 100%; height: 100%; background: #ff0033;
            opacity: 0; z-index: 1000; pointer-events: none; animation: flash 0.6s ease-out forwards;
        }
        @keyframes flash { 0% { opacity: 0.4; } 100% { opacity: 0; } }

        /* ==================== ANTARMUKA UTAMA JAM DIGITAL ==================== */
        .main-interface {
            position: relative; z-index: 2; width: 100%; max-width: 1250px; 
            padding: 60px 40px; text-align: center;
            opacity: 0; transform: scale(0.98) translateY(5px);
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            
            border: 1px solid rgba(255, 0, 51, 0.08);
            background: linear-gradient(180deg, rgba(10, 1, 2, 0.4) 0%, rgba(2, 0, 0, 0.7) 100%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(255, 0, 51, 0.02);
            border-radius: 4px;
        }
        .main-interface.visible { opacity: 1; transform: scale(1) translateY(0); }

        /* Aksen Sudut Sasis Bingkai Premium */
        .main-interface::before, .main-interface::after {
            content: ''; position: absolute; width: 14px; height: 14px; border-color: rgba(255, 0, 51, 0.4); border-style: solid; pointer-events: none;
        }
        .main-interface::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .main-interface::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        .corporate-header { font-size: 12px; text-transform: uppercase; letter-spacing: 8px; color: #777777; margin-bottom: 45px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .network-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(5, 0, 1, 0.8); border: 1px solid #220104; border-radius: 2px; font-size: 9px; letter-spacing: 2px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        
        .online .status-dot { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .online { color: #828e87; }
        
        .offline .status-dot { background-color: #ff0033; animation: fast-blink 0.4s infinite alternate; }
        .offline { color: #ff3344; border-color: #55010d; box-shadow: 0 0 15px rgba(255, 0, 51, 0.1); }
        @keyframes fast-blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Layout Jam Rapat Solid ala Time.is */
        .clock-row { display: flex; justify-content: center; align-items: baseline; font-variant-numeric: tabular-nums; margin-bottom: 25px; }
        .time-main { 
            font-size: 150px; font-weight: 900; color: #eaeeef; letter-spacing: -5px; 
            text-shadow: 0 0 35px rgba(255, 0, 51, 0.4), 0 0 10px rgba(212, 175, 55, 0.15), 0 0 2px #ffffff; 
        }
        
        .colon { padding: 0 3px; color: #eaeeef; letter-spacing: -3px; }
        .time-seconds { font-size: 72px; font-weight: 300; color: #cc1e3d; margin-left: 12px; letter-spacing: -2px; text-shadow: 0 0 15px rgba(204, 30, 61, 0.35); }
        .time-zone { font-size: 26px; font-weight: 800; color: #3d3d3d; margin-left: 18px; letter-spacing: 1px; }

        .divider-line { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, #55020f 20%, #ff0033 50%, #55020f 80%, transparent); margin-bottom: 35px; }
        .date-display { font-size: 36px; font-weight: 900; letter-spacing: 6px; color: #c8c8c8; text-transform: uppercase; margin-bottom: 35px; }

        /* Panel Metadata Source */
        .source-metadata-box { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 9px; letter-spacing: 2px; color: #444444; text-transform: uppercase; }
        .meta-link { text-decoration: none; color: #771426; font-weight: 600; border-bottom: 1px dotted #33070e; padding-bottom: 2px; transition: all 0.3s ease; }
        .meta-link:hover { color: #ff0033; border-bottom: 1px solid #ff0033; text-shadow: 0 0 8px rgba(255, 0, 51, 0.6); }
    </style>
</head>
<body>
    <div class="background-overlay"></div>

    <!-- Modul Intro Sinematik Gerbang Cyber Mekanis Premium -->
    <div id="intro-container">
        <div class="flash-bang"></div>
        
        <!-- Bilah Gerbang Fisik Kiri & Kanan -->
        <div class="gate-half gate-left"></div>
        <div class="gate-half gate-right"></div>
        
        <!-- Kontainer Khusus Efek Guguran Kelopak Mawar PNG -->
        <div class="petal-container" id="petal-zone"></div>
        
        <!-- Kontainer Scan Tengah Menampilkan Logo Mandiri -->
        <div class="megah-scan-box">
            <div class="laser-line-megah"></div>
            <div class="logo-mwtt-gold">MWTT</div>
        </div>
    </div>

    <!-- Antarmuka Utama Jam Digital (Dengan Sasis Bingkai Premium) -->
    <div class="main-interface" id="main-ui">
        <div class="corporate-header">
            <span>Mawar Grup — Official Attendance Record</span>
            <div id="net-indicator" class="network-indicator online">
                <div class="status-dot"></div>
                <span id="net-text">SYSTEM SECURE</span>
            </div>
        </div>

        <!-- Baris Jam Horizontal Tunggal (Font Solid Rapat & Titik Dua Diam) -->
        <div class="clock-row">
            <span class="time-main" id="clock-main">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="clock-seconds">00</span>
            <span class="time-zone" id="clock-zone">WIB</span>
        </div>

        <div class="divider-line"></div>

        <!-- Tanggal Besar & Tebal -->
        <div class="date-display" id="date-display">KAMIS, 01 JANUARI 1970</div>

        <!-- Panel Informasi Source Terbuka (Tautan Valid Menuju Time.is) -->
        <div class="source-metadata-box">
            <div class="meta-item">
                TIME REF: <a href="https://time.is" target="_blank" rel="noopener noreferrer" class="meta-link" id="meta-server">GLOBAL NTP SERVER</a>
            </div>
            <div class="meta-item">SECURE LOG: <strong id="meta-status" style="font-weight: 600; color: #8a9990;">SYNCED WITH HTTPS NETWORK</strong></div>
        </div>
    </div>

    <script>
        // Global variabel untuk melacak selisih waktu komputer dengan Server API (Anti-Manipulasi)
        let timeOffsetMilliseconds = 0;
        let isTimeSynced = false;

        // 1. Generator Kelopak Mawar PNG Jatuh Alami pada Modul Intro
        function spawnRosePetals() {
            const petalZone = document.getElementById('petal-zone');
            const totalPetals = 25; // Kerapatan kelopak mawar di layar intro

            for (let i = 0; i < totalPetals; i++) {
                const petal = document.createElement('div');
                petal.className = 'rose-petal';
                petal.style.backgroundImage = "url('kelopak-mawar.png')";
                
                // Variasi Ukuran, Posisi Horizontal, Putaran Awal, Kecepatan, dan Jeda
                const size = Math.random() * 25 + 20; // Ukuran 20px hingga 45px agar detail urat daun tampak
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}%`;
                petal.style.animationDuration = `${Math.random() * 3 + 3}s`; // Jatuh santai durasi 3s - 6s
                petal.style.animationDelay = `${Math.random() * 3.5}s`;
                
                petalZone.appendChild(petal);
            }
        }
        spawnRosePetals();

        // 2. Modul Core: Mengambil Waktu Akurat dari Server Internet (Mengunci Kecurangan VPN/Inspect)
        async function syncTimeWithGlobalServer() {
            const metaStatus = document.getElementById('meta-status');
            const metaServer = document.getElementById('meta-server');
            
            try {
                const startTime = Date.now();
                // Mengambil data dari API Waktu Global Resmi tepercaya
                const response = await fetch('https://worldtimeapi.org');
                
                if (!response.ok) throw new Error('Server API sibuk');
                
                const data = await response.json();
                const endTime = Date.now();
                
                // Menghitung latensi jaringan agar perhitungan milidetik tetap super presisi
                const latency = (endTime - startTime) / 2;
                const serverTime = new Date(data.datetime).getTime() + latency;
                const localTime = endTime;
                
                // Kunci angka selisih deviasi waktu PC pekerja
                timeOffsetMilliseconds = serverTime - localTime;
                isTimeSynced = true;
                
                if (navigator.onLine) {
                    metaStatus.textContent = `SYNCED (LATENCY: ±${Math.round(latency)}ms)`;
                    metaStatus.style.color = "#8a9990";
                }
            } catch (error) {
                console.warn('Gagal sinkronisasi API, sistem beralih ke cadangan terenkripsi:', error);
                isTimeSynced = false;
                if (navigator.onLine) {
                    metaStatus.textContent = "API TIMEOUT (FALLBACK PROTOCOL ACTIVE)";
                    metaStatus.style.color = "#d4af37";
                }
            }
        }

        // Lakukan sinkronisasi senyap tepat saat laser scan sedang berjalan di intro
        syncTimeWithGlobalServer();

        // 3. Logika Eksekusi Gerbang Cyber Terbelah (Tepat 3.5 Detik)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-container');
                const mainUi = document.getElementById('main-ui');
                
                intro.classList.add('gate-open');
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    mainUi.classList.add('visible');
                }, 1600); 
            }, 3500); 
        });

        // 4. Detektor Status Jaringan Real-Time
        function updateNetworkStatus() {
            const indicator = document.getElementById('net-indicator');
            const text = document.getElementById('net-text');
            const metaStatus = document.getElementById('meta-status');
            const metaServer = document.getElementById('meta-server');

            if (navigator.onLine) {
                indicator.className = "network-indicator online";
                text.textContent = "SYSTEM SECURE";
                metaServer.textContent = "GLOBAL NTP SERVER";
                metaServer.setAttribute("href", "https://time.is");
                metaServer.style.pointerEvents = "auto";
                if(!isTimeSynced) syncTimeWithGlobalServer(); // Coba sinkronisasi ulang jika internet kembali menyala
            } else {
                indicator.className = "network-indicator offline";
                text.textContent = "ACCESS DENIED";
                metaServer.textContent = "LOCAL INTERNAL CLOCK";
                metaServer.removeAttribute("href");
                metaServer.style.pointerEvents = "none";
                metaStatus.textContent = "NETWORK INTERRUPTED (UNVERIFIED)";
                metaStatus.style.color = "#ff3344";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // 5. Mesin Waktu Utama Jam & Tanggal (Telah Dikoreksi Selisih Server)
        function updateClock() {
            const localNow = new Date();
            // Jam berjalan menggunakan waktu PC asli yang sudah dikoreksi otomatis berdasarkan selisih waktu API
            const correctedTime = new Date(localNow.getTime() + timeOffsetMilliseconds);

            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            let hours = String(correctedTime.getHours()).padStart(2, '0');
            let minutes = String(correctedTime.getMinutes()).padStart(2, '0');
            let seconds = String(correctedTime.getSeconds()).padStart(2, '0');
            
            // Titik dua tetap solid dan presisi (tidak berkedip kasual)
            document.getElementById('clock-main').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            const tzString = correctedTime.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            document.getElementById('clock-zone').textContent = tzString;

            let dayName = days[correctedTime.getDay()];
            let dayNum = String(correctedTime.getDate()).padStart(2, '0');
            let monthName = months[correctedTime.getMonth()];
            let year = correctedTime.getFullYear();

            document.getElementById('date-display').textContent = `${dayName}, ${dayNum} ${monthName} ${year}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
