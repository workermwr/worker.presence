<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <style>
        /* Reset & Base Style */
        <style>
    /* Reset & Base Style */
    
    /* --- TEMPEL KODE KURSOR MAWAR DI SINI --- */
    html, body {
        cursor: url('mawar-cursor.png'), auto; 
    }
    * {
        cursor: url('mawar-cursor.png'), auto !important;
    }
    /* ---------------------------------------- */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
    }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050000;
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Latar Belakang Mawar Premium */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.85), rgba(5, 0, 0, 0.95)),
                url('mawar.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Modul Intro Sinematik (3.5 Detik) */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        .laser-scan-box {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-m {
            font-size: 140px;
            font-weight: 900;
            color: #111;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            position: relative;
            letter-spacing: -5px;
        }

        /* Efek Laser Scan */
        .laser-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background: #ff0033;
            box-shadow: 0 0 15px #ff0033, 0 0 30px #ff0033;
            animation: scan 1.75s ease-in-out infinite alternate;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0.3; }
            50% { opacity: 1; }
            100% { top: 90%; opacity: 0.3; }
        }

        /* Konten Utama */
        .main-interface {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 1.5s cubic-bezier(0.1, 0.8, 0.25, 1), transform 1.5s cubic-bezier(0.1, 0.8, 0.25, 1);
        }

        .main-interface.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Header Korporat */
        .corporate-header {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 7px;
            color: #888888;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* Status Jaringan */
        .network-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(15, 0, 0, 0.6);
            border: 1px solid #2a0005;
            border-radius: 3px;
            font-size: 10px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        /* Status Online */
        .online .status-dot {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }
        .online { color: #8a9990; }

        /* Status Offline (Kedip Cepat) */
        .offline .status-dot {
            background-color: #ff0033;
            animation: fast-blink 0.4s infinite alternate;
        }
        .offline {
            color: #ff3344;
            border-color: #660011;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.1);
        }

        @keyframes fast-blink {
            0% { opacity: 0.2; box-shadow: 0 0 0px #ff0033; }
            100% { opacity: 1; box-shadow: 0 0 10px #ff0033; }
        }

        /* Tampilan Jam Baris Horizontal tunggal */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            font-variant-numeric: tabular-nums;
            margin-bottom: 20px;
        }

        /* Angka Utama (Platinum + Crimson Glow) */
        .time-main {
            font-size: 110px;
            font-weight: 300;
            color: #e5e9ec;
            letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.4), 0 0 2px rgba(255, 255, 255, 0.8);
        }

        /* Titik Dua Berkedip */
        .colon {
            animation: slow-blink 1s infinite steps(1, start);
            padding: 0 4px;
            color: #d1d5d8;
        }

        @keyframes slow-blink {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 1; }
        }

        /* Detik (Merah Mawar, Lebih Kecil & Tipis) */
        .time-seconds {
            font-size: 55px;
            font-weight: 200;
            color: #b31936;
            margin-left: 15px;
            text-shadow: 0 0 10px rgba(179, 25, 54, 0.3);
        }

        /* Zona Waktu */
        .time-zone {
            font-size: 22px;
            font-weight: 400;
            color: #666666;
            margin-left: 20px;
            letter-spacing: 2px;
        }

        /* Garis Merah Tegas */
        .divider-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #800016 15%, #ff0033 50%, #800016 85%, transparent);
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
            margin-bottom: 25px;
        }

        /* Bagian Tanggal (Besar & Tebal) */
        .date-display {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #cccccc;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <!-- Modul Intro Sinematik -->
    <div id="intro-container">
        <div class="laser-scan-box">
            <div class="laser-line"></div>
            <div class="logo-m">M</div>
        </div>
    </div>

    <!-- Antarmuka Utama -->
    <div class="main-interface" id="main-ui">
        <div class="corporate-header">
            <span>Mawar Grup — Official Attendance Record</span>
            <div id="net-indicator" class="network-indicator online">
                <div class="status-dot"></div>
                <span id="net-text">SYSTEM SECURE</span>
            </div>
        </div>

        <!-- Baris Jam Horizontal Tunggal -->
        <div class="clock-row">
            <span class="time-main" id="clock-main">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="clock-seconds">00</span>
            <span class="time-zone" id="clock-zone">WIB</span>
        </div>

        <div class="divider-line"></div>

        <!-- Tanggal Besar & Tebal -->
        <div class="date-display" id="date-display">KAMIS, 01 JANUARI 1970</div>
    </div>

    <script>
        // Logika Transisi Intro Sinematik (3.5 Detik)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-container');
                const mainUi = document.getElementById('main-ui');
                
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    mainUi.classList.add('visible');
                }, 800); // Sinkronisasi durasi efek fade-out
            }, 3500); // Pas 3.5 Detik
        });

        // Detektor Status Jaringan Real-Time
        function updateNetworkStatus() {
            const indicator = document.getElementById('net-indicator');
            const text = document.getElementById('net-text');

            if (navigator.onLine) {
                indicator.className = "network-indicator online";
                text.textContent = "SYSTEM SECURE";
            } else {
                indicator.className = "network-indicator offline";
                text.textContent = "ACCESS DENIED";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus(); // Cek inisiasi awal

        // Sistem Pembaruan Waktu Jam & Tanggal
        function updateClock() {
            const now = new Date();

            // Pilihan nama hari dan bulan bahasa Indonesia formal
            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            // Format Jam:Menit dengan titik dua terpisah untuk animasi css
            document.getElementById('clock-main').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            // Dapatkan Kode Singkatan Zona Waktu
            const tzString = now.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            document.getElementById('clock-zone').textContent = tzString;

            // Format Tanggal
            let dayName = days[now.getDay()];
            let dayNum = String(now.getDate()).padStart(2, '0');
            let monthName = months[now.getMonth()];
            let year = now.getFullYear();

            document.getElementById('date-display').textContent = `${dayName}, ${dayNum} ${monthName} ${year}`;
        }

        setInterval(updateClock, 1000);
        updateClock(); // Jalankan langsung tanpa jeda 1 detik pertama
    </script>
</body>
</html>
