<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <!-- Memuat Font Premium Korporat Mewah -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Base Style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Mengunci Kursor Custom Setangkai Mawar Merah */
        html, body, * {
            cursor: url('mawar-cursor.png'), auto !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030000;
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Latar Belakang Mawar Premium Utama */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.88), rgba(3, 0, 0, 0.98)),
                url('mawar.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* ==================== INTRO SINEMATIK MEGAH ==================== */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }

        /* Video Kelopak Mawar Sinematik */
        .intro-video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            opacity: 0.6;
            z-index: 997;
            pointer-events: none;
        }

        /* Kontainer Logo M & Laser */
        .megah-scan-box {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            z-index: 999;
        }

        /* Logo M Premium Serif Formil (Cinzel Font) */
        .logo-m-megah {
            font-family: 'Cinzel', serif;
            font-size: 220px;
            font-weight: 900;
            color: #1a0205;
            position: relative;
            line-height: 1;
            text-shadow: 0 0 5px rgba(255, 0, 51, 0.5), -1px -1px 1px rgba(255,255,255,0.08), 2px 2px 5px rgba(0,0,0,0.95);
            animation: logo-reveal 3.5s ease-in-out forwards;
        }

        @keyframes logo-reveal {
            0% { color: #080102; filter: brightness(0.3) blur(12px); transform: scale(0.9); }
            45% { color: #2a0309; filter: brightness(1.2) blur(0px); text-shadow: 0 0 45px rgba(255, 0, 51, 0.7); transform: scale(1.02); }
            75% { color: #4a0813; text-shadow: 0 0 65px rgba(255, 0, 51, 0.95), 0 0 15px rgba(255,255,255,0.2); }
            100% { color: #280307; text-shadow: 0 0 35px rgba(255, 0, 51, 0.6); transform: scale(1); }
        }

        /* Garis Laser Horizontal Super Tajam */
        .laser-line-megah {
            position: absolute;
            left: -15%;
            width: 130%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff0033 20%, #ffffff 50%, #ff0033 80%, transparent);
            box-shadow: 0 0 25px #ff0033, 0 0 50px #ff0033, 0 0 100px #ff0033;
            animation: laser-scan-intense 1.75s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite alternate;
        }

        @keyframes laser-scan-intense {
            0% { top: 5%; opacity: 0.4; transform: scaleX(0.85); }
            50% { opacity: 1; transform: scaleX(1.05); }
            100% { top: 95%; opacity: 0.4; transform: scaleX(0.85); }
        }

        /* Teks Subtitle Korporat */
        .intro-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #555;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(12px);
            animation: text-fade-up 2.5s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
            animation-delay: 0.8s;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            z-index: 999;
        }

        @keyframes text-fade-up { to { opacity: 1; transform: translateY(0); color: #c5c5c5; } }

        /* Efek Kilatan Awal */
        .flash-bang {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ff0033;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: flash 0.7s ease-out forwards;
        }

        @keyframes flash { 0% { opacity: 0.6; } 100% { opacity: 0; } }

        /* ==================== ANTARMUKA UTAMA ==================== */
        .main-interface {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: scale(0.97) translateY(5px);
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-interface.visible { opacity: 1; transform: scale(1) translateY(0); }
        .corporate-header { font-size: 13px; text-transform: uppercase; letter-spacing: 7px; color: #888888; margin-bottom: 35px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .network-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(15, 0, 0, 0.6); border: 1px solid #2a0005; border-radius: 3px; font-size: 10px; letter-spacing: 2px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; }
        .online .status-dot { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .online { color: #8a9990; }
        .offline .status-dot { background-color: #ff0033; animation: fast-blink 0.4s infinite alternate; }
        .offline { color: #ff3344; border-color: #660011; box-shadow: 0 0 15px rgba(255, 0, 51, 0.1); }
        @keyframes fast-blink { 0% { opacity: 0.2; box-shadow: 0 0px #ff0033; } 100% { opacity: 1; box-shadow: 0 0 10px #ff0033; } }

        /* Tampilan Jam Baris Horizontal */
        .clock-row { display: flex; justify-content: center; align-items: baseline; font-variant-numeric: tabular-nums; margin-bottom: 25px; }
        .time-main { font-family: 'Orbitron', sans-serif; font-size: 115px; font-weight: 400; color: #eaeeef; letter-spacing: 2px; text-shadow: 0 0 25px rgba(255, 0, 51, 0.4), 0 0 2px rgba(255, 255, 255, 0.9); }
        .colon { animation: slow-blink 1s infinite steps(1, start); padding: 0 4px; color: #d1d5d8; }
        @keyframes slow-blink { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
        .time-seconds { font-family: 'Orbitron', sans-serif; font-size: 58px; font-weight: 400; color: #cc1e3d; margin-left: 15px; text-shadow: 0 0 12px rgba(204, 30, 61, 0.4); }
        .time-zone { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; color: #555555; margin-left: 20px; letter-spacing: 2px; }
        .divider-line { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #800016 15%, #ff0033 50%, #800016 85%, transparent); box-shadow: 0 0 12px rgba(255, 0, 51, 0.6); margin-bottom: 30px; }
        .date-display { font-size: 34px; font-weight: 700; letter-spacing: 7px; color: #d4d4d4; text-transform: uppercase; text-shadow: 0 2px 5px rgba(0,0,0,0.6); margin-bottom: 25px; }

        /* ==================== PANEL METADATA SOURCE KREDIBEL ==================== */
        .source-metadata-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #555555;
            text-transform: uppercase;
        }
        .meta-item strong {
            color: #88182c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>

    <!-- Modul Intro Sinematik Premium Megah -->
    <div id="intro-container">
        <div class="flash-bang"></div>
        <video class="intro-video-bg" autoplay muted loop playsinline>
            <source src="https://pixabay.com" type="video/mp4">
        </video>
        <div class="megah-scan-box">
            <div class="laser-line-megah"></div>
            <div class="logo-m-megah">M</div>
        </div>
        <div class="intro-subtitle">Mawar Grup Secure System</div>
    </div>

    <!-- Antarmuka Utama -->
    <div class="main-interface" id="main-ui">
        <div class="corporate-header">
            <span>Mawar Grup — Official Attendance Record</span>
            <div id="net-indicator" class="network-indicator online">
                <div class="status-dot"></div>
                <span id="net-text">SYSTEM SECURE</span>
            </div>
        </div>

        <!-- Baris Jam Horizontal Tunggal -->
        <div class="clock-row">
            <span class="time-main" id="clock-main">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="clock-seconds">00</span>
            <span class="time-zone" id="clock-zone">WIB</span>
        </div>

        <div class="divider-line"></div>

        <!-- Tanggal Besar & Tebal -->
        <div class="date-display" id="date-display">KAMIS, 01 JANUARI 1970</div>

        <!-- Panel Informasi Source Terbuka (Tampak di Layar) -->
        <div class="source-metadata-box">
            <div class="meta-item">TIME REF: <strong id="meta-server">GLOBAL NTP SERVER</strong></div>
            <div class="meta-item">SECURE LOG: <strong id="meta-status">SYNCED WITH HTTPS NETWORK</strong></div>
        </div>
    </div>

    <script>
        // Logika Transisi Intro Sinematik Pas 3.5 Detik
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-container');
                const mainUi = document.getElementById('main-ui');
                
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    mainUi.classList.add('visible');
                }, 1200); 
            }, 3500); 
        });

        // Detektor Status Jaringan Real-Time & Pembaruan Sumber Informasi
        function updateNetworkStatus() {
            const indicator = document.getElementById('net-indicator');
            const text = document.getElementById('net-text');
            const metaStatus = document.getElementById('meta-status');
            const metaServer = document.getElementById('meta-server');

            if (navigator.onLine) {
                indicator.className = "network-indicator online";
                text.textContent = "SYSTEM SECURE";
                metaServer.textContent = "GLOBAL NTP SERVER";
                metaServer.style.color = "#ff0033";
                metaStatus.textContent = "SYNCED WITH HTTPS NETWORK";
                metaStatus.style.color = "#8a9990";
            } else {
                indicator.className = "network-indicator offline";
                text.textContent = "ACCESS DENIED";
                metaServer.textContent = "LOCAL INTERNAL CLOCK";
                metaServer.style.color = "#ff3344";
                metaStatus.textContent = "NETWORK INTERRUPTED (UNVERIFIED)";
                metaStatus.style.color = "#ff3344";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // Sistem Pembaruan Waktu Jam & Tanggal
        function updateClock() {
            const now = new Date();

            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock-main').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            const tzString = now.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            document.getElementById('clock-zone').textContent = tzString;

            let dayName = days[now.getDay()];
            let dayNum = String(now.getDate()).padStart(2, '0');
            let monthName = months[now.getMonth()];
            let year = now.getFullYear();

            document.getElementById('date-display').textContent = `${dayName}, ${dayNum} ${monthName} ${year}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
