<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mawar Grup — Attendance Timepiece</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .rose-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(circle at center, rgba(5, 5, 5, 0.4) 0%, rgba(5, 5, 5, 0.98) 85%), 
                              url('mawar.jpg');
            background-size: cover;
            background-position: center;
        }

        .workspace-panel {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 80vw;
            padding: 40px;
        }

        .corporate-header {
            font-size: 3vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        .corporate-sub {
            font-size: 1.6vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #bd1e2c; 
            margin-bottom: 5vh;
        }

        .time-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            margin-bottom: 5vh;
        }

        #clock-hm {
            font-size: 24vh;
            font-weight: 300;
            letter-spacing: -2px;
            color: #d6d6d6; 
            font-variant-numeric: tabular-nums;
            filter: drop-shadow(0 0 15px rgba(189, 30, 44, 0.5)) drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
        }

        /* ANIMASI KEDIP UNTUK TITIK DUA JAM */
        .colon-blink {
            animation: blinkEffect 1s step-start infinite;
        }

        @keyframes blinkEffect {
            50% { opacity: 0; }
        }

        #clock-s {
            font-size: 5.5vh;
            font-weight: 500;
            color: #ffffff; 
            letter-spacing: 4px;
            margin-top: 2.5vh;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        #date {
            font-size: 3.5vh; 
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-top: 2px solid #bd1e2c; 
            padding-top: 2.5vh;
            width: 65%;
            display: inline-block;
            margin-bottom: 3vh;
        }

        /* INDIKATOR STATUS SISTEM AKTIF */
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.4vh;
            font-weight: 600;
            letter-spacing: 3px;
            color: #888888;
            text-transform: uppercase;
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background-color: #30d158; /* Hijau iOS/Apple System */
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
            animation: pulseDot 2s infinite alternate;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 4px #30d158; }
            100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px #30d158; }
        }
    </style>
</head>
<body>

    <div class="rose-background"></div>

    <div class="workspace-panel">
        <div class="corporate-header">Mawar Grup</div>
        <div class="corporate-sub">Official Attendance Record</div>
        
        <div class="time-container">
            <!-- Tempat merender Jam, Menit, dan Titik Dua Berkedip -->
            <div id="clock-hm">00<span class="colon-blink">:</span>00</div>
            <div id="clock-s">00 SEC • LOCAL TIME</div>
        </div>
        
        <div id="date">Loading System...</div>
        
        <!-- Tambahan status operasional live agar terverifikasi resmi -->
        <div class="status-indicator">
            <div class="green-dot"></div>
            <span>System Secure & Active</span>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeZoneString = now.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            
            // Merender angka dengan titik dua berkedip tetap terjaga di tengah
            document.getElementById('clock-hm').innerHTML = `${hours}<span class="colon-blink">:</span>${minutes}`;
            document.getElementById('clock-s').textContent = `${seconds} SEC • ${timeZoneString}`;
            
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
