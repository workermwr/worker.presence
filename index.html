<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mawar Grup — Official Enterprise Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Kontainer Utama - Struktur Monokromatik & Maskulin */
        .workspace-panel {
            text-align: center;
            width: 100%;
            max-width: 80vw;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Identitas Formal Perusahaan - Tegas & Berwibawa */
        .corporate-header {
            font-size: 2.8vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 12px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        /* Sub-Header Penanda Ruang Kerja Aktif */
        .corporate-sub {
            font-size: 1.6vh;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #bd1e2c; /* Warna Merah Mawar Grup Solid */
            margin-bottom: 6vh;
        }

        /* Box Waktu Utama */
        .time-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            margin-bottom: 6vh;
        }

        /* Jam & Menit - Putih Solid, Tajam, & Presisi */
        #clock-hm {
            font-size: 24vh;
            font-weight: 200;
            letter-spacing: -2px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        /* Detik - Terpisah Tipis di Bawah */
        #clock-s {
            font-size: 5vh;
            font-weight: 300;
            color: #555555; /* Abu-abu baja */
            letter-spacing: 4px;
            margin-top: 2vh;
            font-variant-numeric: tabular-nums;
        }

        /* Tanggal DIUBAH TOTAL: Ukuran Diperbesar & Sangat Jelas */
        #date {
            font-size: 3.2vh; /* Diperbesar signifikan agar langsung terlihat */
            font-weight: 500;
            color: #e0e0e0;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-top: 2px solid #bd1e2c; /* Garis pembatas Merah Mawar Grup */
            padding-top: 3vh;
            width: 60%;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="workspace-panel">
        <!-- Identitas Baru: Menghilangkan kesan alay dan diganti penanda resmi -->
        <div class="corporate-header">Mawar Grup</div>
        <div class="corporate-sub">Official Workspace</div>
        
        <div class="time-container">
            <div id="clock-hm">00:00</div>
            <div id="clock-s">00 SEC</div>
        </div>
        
        <div id="date">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock-hm').textContent = `${hours}:${minutes}`;
            document.getElementById('clock-s').textContent = `${seconds} SEC`;
            
            // Format Tanggal Internasional yang Bersih
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
