<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Official Attendance Record</title>
    <style>
        /* Reset & Base Style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Mengunci Kursor Custom Setangkai Mawar Merah */
        html, body, * {
            cursor: url('mawar-cursor.png'), auto !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030000;
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Latar Belakang Mawar Premium */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.88), rgba(3, 0, 0, 0.98)),
                url('mawar.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* ==================== INTRO SINEMATIK MEGAH ==================== */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0c0204 0%, #020000 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Kontainer Glitch & Laser */
        .megah-scan-box {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Logo M Bergaya Logam Crimson */
        .logo-m-megah {
            font-size: 190px;
            font-weight: 900;
            color: #110204;
            position: relative;
            letter-spacing: -5px;
            line-height: 1;
            text-shadow: 
                0 0 2px rgba(255, 0, 51, 0.3),
                -1px -1px 0px rgba(255,255,255,0.05),
                1px 1px 0px rgba(0,0,0,0.9);
            animation: logo-reveal 3.5s ease-in-out forwards;
        }

        @keyframes logo-reveal {
            0% { color: #0a0102; filter: brightness(0.5) blur(10px); }
            40% { color: #1a0306; filter: brightness(1) blur(0px); text-shadow: 0 0 30px rgba(255, 0, 51, 0.4); }
            70% { color: #2d050a; text-shadow: 0 0 50px rgba(255, 0, 51, 0.8), 0 0 10px rgba(255,255,255,0.2); }
            100% { color: #1c0205; text-shadow: 0 0 25px rgba(255, 0, 51, 0.5); }
        }

        /* Garis Laser Horizontal Super Tajam */
        .laser-line-megah {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff0033 20%, #ffffff 50%, #ff0033 80%, transparent);
            box-shadow: 0 0 20px #ff0033, 0 0 40px #ff0033, 0 0 80px #ff0033;
            animation: laser-scan-intense 1.75s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite alternate;
        }

        @keyframes laser-scan-intense {
            0% { top: 5%; opacity: 0.5; transform: scaleX(0.9); }
            50% { opacity: 1; transform: scaleX(1.05); }
            100% { top: 95%; opacity: 0.5; transform: scaleX(0.9); }
        }

        /* Teks Subtitle Korporat */
        .intro-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: #666;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(10px);
            animation: text-fade-up 2.5s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
            animation-delay: 0.8s;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        @keyframes text-fade-up {
            to { opacity: 1; transform: translateY(0); color: #b5b5b5; }
        }

        /* Efek Kilatan Awal Saat Web Dimuat */
        .flash-bang {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ff0033;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: flash 0.6s ease-out forwards;
        }

        @keyframes flash {
            0% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        /* ==================== ANTARMUKA UTAMA ==================== */
        .main-interface {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: scale(0.97) translateY(5px);
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-interface.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Header Korporat */
        .corporate-header {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 7px;
            color: #888888;
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* Status Jaringan */
        .network-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(15, 0, 0, 0.6);
            border: 1px solid #2a0005;
            border-radius: 3px;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .online .status-dot {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }
        .online { color: #8a9990; }

        .offline .status-dot {
            background-color: #ff0033;
            animation: fast-blink 0.4s infinite alternate;
        }
        .offline {
            color: #ff3344;
            border-color: #660011;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.1);
        }

        @keyframes fast-blink {
            0% { opacity: 0.2; box-shadow: 0 0 0px #ff0033; }
            100% { opacity: 1; box-shadow: 0 0 10px #ff0033; }
        }

        /* Tampilan Jam Baris Horizontal */
        .clock-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            font-variant-numeric: tabular-nums;
            margin-bottom: 25px;
        }

        /* Angka Utama (Platinum + Crimson Glow Tajam) */
        .time-main {
            font-size: 115px;
            font-weight: 300;
            color: #eaeeef;
            letter-spacing: -2px;
            text-shadow: 0 0 25px rgba(255, 0, 51, 0.35), 0 0 2px rgba(255, 255, 255, 0.9);
        }

        .colon {
            animation: slow-blink 1s infinite steps(1, start);
            padding: 0 4px;
            color: #d1d5d8;
        }

        @keyframes slow-blink {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 1; }
        }

        /* Detik (Merah Mawar, Lebih Kecil & Tipis) */
        .time-seconds {
            font-size: 58px;
            font-weight: 200;
            color: #cc1e3d;
            margin-left: 15px;
            text-shadow: 0 0 12px rgba(204, 30, 61, 0.4);
        }

        /* Zona Waktu */
        .time-zone {
            font-size: 24px;
            font-weight: 400;
            color: #555555;
            margin-left: 20px;
            letter-spacing: 2px;
        }

        /* Garis Pembatas Merah Tegas */
        .divider-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #800016 15%, #ff0033 50%, #800016 85%, transparent);
            box-shadow: 0 0 12px rgba(255, 0, 51, 0.6);
            margin-bottom: 30px;
        }

        /* Bagian Tanggal (Besar & Tebal) */
        .date-display {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 7px;
            color: #d4d4d4;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <!-- Modul Intro Sinematik Premium Megah -->
    <div id="intro-container">
        <div class="flash-bang"></div>
        <div class="megah-scan-box">
            <div class="laser-line-megah"></div>
            <div class="logo-m-megah">M</div>
        </div>
        <div class="intro-subtitle">Mawar Grup Secure System</div>
    </div>

    <!-- Antarmuka Utama -->
    <div class="main-interface" id="main-ui">
        <div class="corporate-header">
            <span>Mawar Grup — Official Attendance Record</span>
            <div id="net-indicator" class="network-indicator online">
                <div class="status-dot"></div>
                <span id="net-text">SYSTEM SECURE</span>
            </div>
        </div>

        <!-- Baris Jam Horizontal Tunggal -->
        <div class="clock-row">
            <span class="time-main" id="clock-main">00<span class="colon">:</span>00</span>
            <span class="time-seconds" id="clock-seconds">00</span>
            <span class="time-zone" id="clock-zone">WIB</span>
        </div>

        <div class="divider-line"></div>

        <!-- Tanggal Besar & Tebal -->
        <div class="date-display" id="date-display">KAMIS, 01 JANUARI 1970</div>
    </div>

    <script>
        // Logika Transisi Intro Sinematik Pas 3.5 Detik
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-container');
                const mainUi = document.getElementById('main-ui');
                
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    mainUi.classList.add('visible');
                }, 1200); // Waktu memudar transisi yang halus
            }, 3500); // Tepat berjalan 3,5 detik
        });

        // Detektor Status Jaringan Real-Time
        function updateNetworkStatus() {
            const indicator = document.getElementById('net-indicator');
            const text = document.getElementById('net-text');

            if (navigator.onLine) {
                indicator.className = "network-indicator online";
                text.textContent = "SYSTEM SECURE";
            } else {
                indicator.className = "network-indicator offline";
                text.textContent = "ACCESS DENIED";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // Sistem Pembaruan Waktu Jam & Tanggal
        function updateClock() {
            const now = new Date();

            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock-main').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            // Membaca Zona Waktu Otomatis
            const tzString = now.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
            document.getElementById('clock-zone').textContent = tzString;

            // Format Tanggal Korporat
            let dayName = days[now.getDay()];
            let dayNum = String(now.getDate()).padStart(2, '0');
            let monthName = months[now.getMonth()];
            let year = now.getFullYear();

            document.getElementById('date-display').textContent = `${dayName}, ${dayNum} ${monthName} ${year}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
