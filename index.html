<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Enterprise Chronograph Dashboard</title>
    <style>
        :root {
            --bg-primary: #050505;
            --brand-red: #bd1e2c;
            --text-primary: #ffffff;
            --text-muted: #d6d6d6;
            --text-dark: #444444;
            --status-green: #30d158;
            --status-red: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ==================== 🎬 MODUL INTRO SINEMATIK MEGAH ==================== */
        #cinema-intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .intro-logo-box {
            position: relative;
            margin-bottom: 30px;
            animation: logoPulse 2s ease-in-out infinite alternate;
        }

        .intro-monogram {
            font-size: 15vh;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.8);
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(189, 30, 44, 0.4);
        }

        .laser-scanner {
            position: absolute;
            width: 120%;
            height: 3px;
            background-color: var(--brand-red);
            box-shadow: 0 0 15px var(--brand-red), 0 0 30px var(--brand-red);
            left: -10%;
            top: 0;
            animation: laserScan 2.5s ease-in-out infinite;
        }

        .intro-load-text {
            font-size: 1.6vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #888888;
            animation: textFlicker 1.5s infinite;
        }

        @keyframes laserScan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes logoPulse {
            0% { transform: scale(0.97); filter: brightness(0.8); }
            100% { transform: scale(1.02); filter: brightness(1.2); }
        }
        @keyframes textFlicker {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; color: #ffffff; }
        }

        /* ==================== 🕒 FRAMEWORK UTAMA JAM ==================== */
        .rose-infrastructure-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: radial-gradient(circle at center, rgba(5, 5, 5, 0.4) 0%, rgba(5, 5, 5, 0.98) 85%), 
                              url('mawar.jpg');
            background-size: cover;
            background-position: center;
        }

        .workspace-master-panel {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 85vw;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s cubic-bezier(0.16, 1, 0.3, 1), transform 2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .workspace-master-panel.reveal-active {
            opacity: 1;
            transform: translateY(0);
        }

        .header-branding-group {
            margin-bottom: 5vh;
        }

        .corporate-header {
            font-size: 3vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 14px;
            color: #e5e5e5;
            margin-bottom: 6px;
        }

        .corporate-sub {
            font-size: 1.5vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 7px;
            color: var(--brand-red); 
        }

        .chronograph-stream-container {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            justify-content: center;
            width: 100%;
            margin-bottom: 6vh;
            font-variant-numeric: tabular-nums;
        }

        .primary-time-digits {
            font-size: 24vh;
            font-weight: 200;
            letter-spacing: -2px;
            color: var(--text-muted);
            line-height: 1;
            filter: drop-shadow(0 0 15px rgba(189, 30, 44, 0.4)) drop-shadow(0 15px 30px rgba(0, 0, 0, 0.9));
        }

        .digital-colon {
            animation: hardwareBlink 1s step-start infinite;
            font-weight: 200;
        }

        @keyframes hardwareBlink {
            50% { opacity: 0.15; }
        }

        .auxiliary-seconds-digits {
            font-size: 8vh;
            font-weight: 200;
            color: var(--brand-red);
            margin-left: 25px;
            letter-spacing: 1px;
            line-height: 1;
            align-self: flex-end;
            padding-bottom: 2vh;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .timezone-badge {
            font-size: 2.2vh;
            font-weight: 400;
            color: #888888;
            letter-spacing: 4px;
            margin-left: 15px;
            text-transform: uppercase;
            align-self: flex-end;
            padding-bottom: 2vh;
        }

        .metadata-calendar-block {
            width: 65%;
            border-top: 2px solid var(--brand-red);
            padding-top: 3vh;
            margin-bottom: 3.5vh;
            display: inline-block;
        }

        #date-display {
            font-size: 3.5vh; 
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .system-telemetry-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.4vh;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: color 0.4s ease;
        }

        .system-telemetry-status.online-mode { color: #888888; }
        .system-telemetry-status.offline-mode { color: var(--status-red); text-shadow: 0 0 10px rgba(255, 69, 58, 0.3); }

        .telemetry-pulse-node {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .online-node {
            background-color: var(--status-green);
            box-shadow: 0 0 8px var(--status-green);
            animation: telemetryPulseGreen 2.5s infinite alternate;
        }

        .offline-node {
            background-color: var(--status-red);
            box-shadow: 0 0 8px var(--status-red);
            animation: telemetryPulseRed 1s infinite alternate;
        }

        @keyframes telemetryPulseGreen {
            0% { transform: scale(0.9); opacity: 0.5; box-shadow: 0 0 4px var(--status-green); }
            100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--status-green); }
        }

        @keyframes telemetryPulseRed {
            0% { transform: scale(0.8); opacity: 0.4; box-shadow: 0 0 4px var(--status-red); }
            100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 16px var(--status-red); }
        }
    </style>
</head>
<body>

    <!-- ==================== 🎬 HTML LAYAR INTRO ==================== -->
    <div id="cinema-intro-overlay">
        <div class="intro-logo-box">
            <div class="intro-monogram">M</div>
            <div class="laser-scanner"></div>
        </div>
        <div class="intro-load-text">CONNECTING TO SECURE MAWAR NETWORK...</div>
    </div>

    <!-- Framework Aplikasi Utama -->
    <div class="rose-infrastructure-bg"></div>

    <div id="main-panel" class="workspace-master-panel">
        <div class="header-branding-group">
            <div class="corporate-header">Mawar Grup</div>
            <div class="corporate-sub">Official Attendance Record</div>
        </div>
        
        <div class="chronograph-stream-container">
            <div id="main-time" class="primary-time-digits">00<span class="digital-colon">:</span>00</div>
            <div id="seconds-stream" class="auxiliary-seconds-digits">00</div>
            <div id="timezone-stream" class="timezone-badge">WIB</div>
        </div>
        
        <div class="metadata-calendar-block">
            <div id="date-display">Loading System...</div>
        </div>
        
        <div id="network-status-panel" class="system-telemetry-status online-mode">
            <div id="network-dot" class="telemetry-pulse-node online-node"></div>
            <span id="network-text">System Secure & Active</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            function executeChronographUpdate() {
                const currentTimeObj = new Date();
(function() {
    'use strict';
    
    function executeChronographUpdate() {
        const currentTimeObj = new Date();
        
        let hoursStr = String(currentTimeObj.getHours()).padStart(2, '0');
        let minutesStr = String(currentTimeObj.getMinutes()).padStart(2, '0');
        let secondsStr = String(currentTimeObj.getSeconds()).padStart(2, '0');
        
        const calculatedZone = currentTimeObj.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
        
        // REVISI TOTAL: Menggunakan string biasa agar aman dari masalah teks putus di server browser
        const colonHtml = '<span class="digital-colon">:</span>';
        document.getElementById('main-time').innerHTML = hoursStr + colonHtml + minutesStr;
        document.getElementById('seconds-stream').textContent = secondsStr;
        document.getElementById('timezone-stream').textContent = calculatedZone;
        
        const calendarOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        document.getElementById('date-display').textContent = currentTimeObj.toLocaleDateString('en-US', calendarOptions);
        
        const panel = document.getElementById('network-status-panel');
        const dot = document.getElementById('network-dot');
        const text = document.getElementById('network-text');
        
        if (navigator.onLine) {
            panel.className = "system-telemetry-status online-mode";
            dot.className = "telemetry-pulse-node online-node";
            text.textContent = "System Secure & Active";
        } else {
            panel.className = "system-telemetry-status offline-mode";
            dot.className = "telemetry-pulse-node offline-node";
            text.textContent = "Access Denied • Offline Detected";
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        setInterval(executeChronographUpdate, 1000);
        executeChronographUpdate();

        setTimeout(() => {
            const introOverlay = document.getElementById('cinema-intro-overlay');
            const mainPanel = document.getElementById('main-panel');
            
            if (introOverlay) introOverlay.style.opacity = '0';
            if (mainPanel) mainPanel.classList.add('reveal-active');
        }, 3500);
    });
})();
