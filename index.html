<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronograph Haute Horlogerie — Live Broadcast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            letter-spacing: -0.02em;
        }

        /* Menggunakan link mawar merah makro alternatif yang sangat stabil */
        .rose-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at center, rgba(3, 3, 3, 0.4) 0%, rgba(3, 3, 3, 0.95) 85%), 
                              url('https://wikimedia.org');
            background-size: cover;
            background-position: center;
            z-index: 1;
            pointer-events: none;
        }

        .clock-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 1600px;
            padding: 0 60px;
            animation: fadeInClock 2.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .welcome-message {
            font-size: 1.1rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 14px;
            color: #ffffff;
            margin-bottom: 10px;
            opacity: 0.9;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 16px;
            color: #bd1e2c;
            margin-bottom: 35px;
            opacity: 0.85;
            text-shadow: 0 0 12px rgba(189, 30, 44, 0.4);
            animation: subtlePulse 4s infinite alternate;
        }

        #clock {
            font-size: 16rem;
            font-weight: 100;
            letter-spacing: -6px;
            line-height: 0.8;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #fff3cc 0%, #e6c667 35%, #b88e2f 60%, #946e19 80%, #e6c667 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 25px 60px rgba(0, 0, 0, 0.98)) drop-shadow(0px 4px 20px rgba(184, 142, 47, 0.2));
        }

        #date {
            font-size: 1.2rem;
            font-weight: 300;
            color: #888888;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        @keyframes fadeInClock {
            0% { opacity: 0; transform: scale(0.97) translateY(15px); filter: blur(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes subtlePulse {
            0% { opacity: 0.7; letter-spacing: 16px; }
            100% { opacity: 0.95; letter-spacing: 16.5px; }
        }
    </style>
</head>
<body>

    <div class="rose-background"></div>

    <div class="clock-container">
        <div class="welcome-message">Welcome Back, Abdul</div>
        <div class="status-badge">Absolute Precision • Realtime Broadcast</div>
        <div id="clock">00:00:00</div>
        <div id="date">Loading Timepiece...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
