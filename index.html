<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawar Grup — Enterprise Chronograph Dashboard</title>
    <style>
        :root {
            --bg-primary: #050505;
            --brand-red: #bd1e2c;
            --text-primary: #ffffff;
            --text-muted: #d6d6d6;
            --text-dark: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Memanggil gambar mawar hitam misterius yang Anda unggah manual */
        .rose-infrastructure-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(circle at center, rgba(5, 5, 5, 0.4) 0%, rgba(5, 5, 5, 0.98) 85%), 
                              url('mawar.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Kompleksitas Arsitektur Grid/Flex Penunjuk Waktu */
        .workspace-master-panel {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 85vw;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-branding-group {
            margin-bottom: 5vh;
        }

        .corporate-header {
            font-size: 3vh;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 14px;
            color: #e5e5e5;
            margin-bottom: 6px;
        }

        .corporate-sub {
            font-size: 1.5vh;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 7px;
            color: var(--brand-red); 
        }

        /* KELOMPOK WAKTU: Menggabungkan seluruh komponen dalam satu baris linier */
        .chronograph-stream-container {
            display: flex;
            flex-direction: row;
            align-items: baseline; /* Menyeimbangkan posisi bawah tulisan */
            justify-content: center;
            width: 100%;
            margin-bottom: 6vh;
            font-variant-numeric: tabular-nums;
        }

        /* Jam dan Menit */
        .primary-time-digits {
            font-size: 24vh;
            font-weight: 200;
            letter-spacing: -2px;
            color: var(--text-muted);
            line-height: 1;
            filter: drop-shadow(0 0 15px rgba(189, 30, 44, 0.4)) drop-shadow(0 15px 30px rgba(0, 0, 0, 0.9));
        }

        /* Animasi kedip canggih pada pemisah jam */
        .digital-colon {
            animation: hardwareBlink 1s step-start infinite;
            font-weight: 200;
        }

        @keyframes hardwareBlink {
            50% { opacity: 0.15; }
        }

        /* DETIK: Berada di baris yang sama dengan ukuran lebih kecil dan tipis */
        .auxiliary-seconds-digits {
            font-size: 8vh; /* Ukuran font lebih kecil secara proporsional */
            font-weight: 200; /* Lebih tipis agar artistik */
            color: var(--brand-red); /* Warna merah mawar grup yang tegas */
            margin-left: 25px; /* Jarak aman dari angka menit */
            letter-spacing: 1px;
            line-height: 1;
            align-self: flex-end; /* Memaksa detik sejajar di sisi bawah jam utama */
            padding-bottom: 2vh; /* Kalibrasi vertikal garis bawah */
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Penanda Zona Waktu Resmi */
        .timezone-badge {
            font-size: 2.2vh;
            font-weight: 400;
            color: #888888;
            letter-spacing: 4px;
            margin-left: 15px;
            text-transform: uppercase;
            align-self: flex-end;
            padding-bottom: 2vh;
        }

        /* Blok Data Kalender */
        .metadata-calendar-block {
            width: 65%;
            border-top: 2px solid var(--brand-red);
            padding-top: 3vh;
            margin-bottom: 3.5vh;
            display: inline-block;
        }

        #date-display {
            font-size: 3.5vh; 
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Modul Status Keamanan Sistem */
        .system-telemetry-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.4vh;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .telemetry-pulse-node {
            width: 8px;
            height: 8px;
            background-color: #30d158; 
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
            animation: telemetryPulse 2.5s infinite alternate;
        }

        @keyframes telemetryPulse {
            0% { transform: scale(0.9); opacity: 0.5; box-shadow: 0 0 4px #30d158; }
            100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px #30d158; }
        }
    </style>
</head>
<body>

    <!-- Infrastruktur Latar Belakang Gambar -->
    <div class="rose-infrastructure-bg"></div>

    <!-- Sistem Panel Utama -->
    <div class="workspace-master-panel">
        
        <div class="header-branding-group">
            <div class="corporate-header">Mawar Grup</div>
            <div class="corporate-sub">Official Attendance Record</div>
        </div>
        
        <!-- Aliran Waktu Satu Baris Linier Sesuai Permintaan -->
        <div class="chronograph-stream-container">
            <!-- Jam dan Menit -->
            <div id="main-time" class="primary-time-digits">00<span class="digital-colon">:</span>00</div>
            <!-- Detik (Kecil) -->
            <div id="seconds-stream" class="auxiliary-seconds-digits">00</div>
            <!-- Zona Waktu -->
            <div id="timezone-stream" class="timezone-badge">WIB</div>
        </div>
        
        <div class="metadata-calendar-block">
            <div id="date-display">Loading System...</div>
        </div>
        
        <div class="system-telemetry-status">
            <div class="telemetry-pulse-node"></div>
            <span>System Secure & Active</span>
        </div>
        
    </div>

    <script>
        (function() {
            'use strict';
            
            function executeChronographUpdate() {
                const currentTimeObj = new Date();
                
                let hoursStr = String(currentTimeObj.getHours()).padStart(2, '0');
                let minutesStr = String(currentTimeObj.getMinutes()).padStart(2, '0');
                let secondsStr = String(currentTimeObj.getSeconds()).padStart(2, '0');
                
                const calculatedZone = currentTimeObj.toLocaleDateString('id-ID', { timeZoneName: 'short' }).split(' ').pop();
                
                // Sinkronisasi data ke struktur DOM HTML secara presisi
                document.getElementById('main-time').innerHTML = `${hoursStr}<span class="digital-colon">:</span>${minutesStr}`;
                document.getElementById('seconds-stream').textContent = secondsStr;
                document.getElementById('timezone-stream').textContent = calculatedZone;
                
                const calendarOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                document.getElementById('date-display').textContent = currentTimeObj.toLocaleDateString('en-US', calendarOptions);
            }

            // Inisialisasi loop sinkronisasi internal
            setInterval(executeChronographUpdate, 1000);
            executeChronographUpdate();
        })();
    </script>
</body>
</html>
